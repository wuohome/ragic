<!DOCTYPE html>

<script src="https://cdn.tailwindcss.com"></script>
<script>
  /* 2026-07-25 接後端定案：配色鎖定 C「工地強光高對比」（Joan 拍板，見規格書 ai-ref），
     A/B 兩組配色與切換 demo 鈕已移除，色碼直接寫死不再走 [data-palette] 切換。 */
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink: '#1F3A44', inkdeep: '#12262E', inkmuted: '#4B6570', inkfaint: '#7C9298',
          paper: '#F0F8FA', line: '#C3D6DB',
          coral: '#004C8C', coraldark: '#003864', coraltint: '#E1EEF8',
          submitted: '#146C2E',
          pending: '#8A5A00', pendingtint: '#FBF0DC', pendingdark: '#634100',
          overlap: '#C81E1E', overlapdark: '#8F1414', overlaptint: '#FBE3E3',
        },
      },
    },
  };
</script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Segoe UI", sans-serif; }
  :root { --c-gap-a: #E1EEF8; --c-gap-b: #C3DCF0; --c-gap-a-hover: #CFE3F5; --c-gap-b-hover: #A9CDE9; }

  /* 「好填寫」語彙沿用 from.html／V1：大字、粗框、明顯焦點狀態，不用細緻小巧的輸入框 */
  select, textarea, input:not([type="checkbox"]) {
    min-height: 52px; font-size: 17px !important; padding: 12px 14px !important;
    border-width: 2px !important; border-radius: 12px !important;
    background-color: #FFFFFF !important; border-color: #B9CBD1 !important;
  }
  select:focus, textarea:focus, input:not([type="checkbox"]):focus {
    border-color: #004C8C !important; outline: none;
    box-shadow: 0 0 0 4px rgba(0, 76, 140, 0.18);
  }
  input[type="checkbox"] { width: 18px; height: 18px; accent-color: #004C8C; }
  .tnum { font-variant-numeric: tabular-nums; }
  .tap44 { min-height: 44px; }
  /* 「時：分」兩個下拉要並排塞進半格寬（手機 375px 也要容得下），收窄左右內距、數字置中 */
  select.time-part { padding: 12px 4px !important; text-align: center; font-variant-numeric: tabular-nums; }
  #toast { transition: opacity 200ms ease-out; }
  .accordion { transition: grid-template-rows 200ms cubic-bezier(0.23, 1, 0.32, 1); }
  .accordion-inner { overflow: hidden; }

  /* 彩色時間軸橫條（2026-07-25 Joan 拍板保留設計，只重做配色）。
     判定邏輯（哪段是 gap／哪段是 block）在 computeTimelineWindow()／buildTimelineSegments()，
     這裡只負責視覺呈現。 */
  .timeline-track { display: flex; width: 100%; height: 38px; border-radius: 10px; overflow: hidden; border: 2px solid #C3D6DB; background: #fff; }
  .timeline-seg { position: relative; height: 100%; min-width: 3px; }
  .timeline-seg-gap { background-image: repeating-linear-gradient(135deg, var(--c-gap-a) 0 7px, var(--c-gap-b) 7px 14px); cursor: pointer; border: none; padding: 0; }
  .timeline-seg-gap:hover, .timeline-seg-gap:focus-visible { background-image: repeating-linear-gradient(135deg, var(--c-gap-a-hover) 0 7px, var(--c-gap-b-hover) 7px 14px); }
  .timeline-seg-block { cursor: pointer; border: none; padding: 0; }
  .timeline-seg-submitted { background: #146C2E; }
  .timeline-seg-pending { background: #FBF0DC; box-shadow: inset 0 0 0 2px #8A5A00; }
  .timeline-seg-overlap { background: #C81E1E; }
  .timeline-seg-overdue { background: repeating-linear-gradient(135deg, #FBF0DC 0 6px, #C81E1E 6px 12px); box-shadow: inset 0 0 0 2px #8A5A00; }
  .timeline-now-marker { position: absolute; top: -5px; bottom: -5px; width: 2px; background: #1F3A44; z-index: 5; pointer-events: none; }
  .timeline-now-dot { position: absolute; top: -12px; height: 6px; width: 6px; border-radius: 999px; background: #1F3A44; transform: translateX(-2px); pointer-events: none; }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0.001ms !important; animation-duration: 0.001ms !important; }
  }
</style>
</head>
<body class="min-h-screen bg-white text-ink">
<datalist id="worklogCaseList"></datalist>

<div class="flex h-screen w-full overflow-hidden">
  <!-- 桌機側欄：深色 app shell，比照 V1／decor-console 既有模組化平台外殼寫法 -->
  <aside class="hidden w-56 shrink-0 flex-col bg-inkdeep lg:flex">
    <div class="flex items-center gap-2.5 border-b border-white/10 p-4">
      <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-coral text-sm font-black text-white" aria-hidden="true">窩</span>
      <div class="min-w-0">
        <p class="truncate text-sm font-black text-white">窩的家工程平台</p>
        <p id="sidebarSubtitle" class="truncate text-[11px] font-bold text-white/60">工作日誌</p>
      </div>
    </div>
    <nav id="sidebarNav" class="flex-1 space-y-1 overflow-y-auto p-3" aria-label="主要模組"></nav>
    <div id="sidebarPlanned" class="space-y-1 border-t border-white/10 p-3"></div>
  </aside>

  <div class="flex min-w-0 flex-1 flex-col overflow-hidden bg-white">
    <header class="flex shrink-0 items-center justify-between gap-3 border-b border-line bg-white px-4 py-3 lg:px-6">
      <div class="flex min-w-0 items-center gap-2.5 lg:hidden">
        <span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-coral text-xs font-black text-white" aria-hidden="true">窩</span>
        <span class="truncate text-sm font-black text-ink">窩的家工程平台</span>
      </div>
      <h1 id="pageTitle" class="hidden text-lg font-black text-ink lg:block">工作日誌</h1>
      <div class="flex shrink-0 items-center gap-2">
        <span id="modeLabel" class="hidden rounded-full bg-line px-2.5 py-1 text-xs font-bold text-inkmuted sm:inline-block"></span>
        <button id="resetButton" type="button" class="tap44 rounded-xl border border-line px-3 text-sm font-bold text-ink hover:bg-paper focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ink">重設本機暫存</button>
      </div>
    </header>

    <main id="mainRoot" class="flex-1 overflow-y-auto px-4 pb-6 pt-5 lg:px-6">
      <section id="view-worklog" class="mx-auto max-w-2xl"></section>
      <section id="view-overview" class="mx-auto max-w-2xl" hidden></section>
    </main>

    <!-- 手機底部 tab bar：非 fixed，正常文件流最後一個 flex 項目（2026-07-25 沿用既驗證過的防遮擋結構） -->
    <nav id="bottomTabBar" class="shrink-0 flex border-t border-line bg-white lg:hidden" aria-label="主要模組"></nav>
  </div>
</div>

<script>
'use strict';

/* =====================================================================================
   工作日誌 V2（2026-07-25 接後端版）── 真實 API，取代純本機原型。
   核心資料模型變更（Joan 2026-07-25 拍板）：「計畫」不再另建資料結構，就是一筆「有起訖時間、
   預先排定行程有填、紀錄內容還空著」的普通紀錄；下班補實際只是回頭補同一筆的「紀錄內容」。
   Block 就是 Ragic maintenance-management/9 的一列，不再有獨立的 Plan 物件／convertPlanToBlock。
   ===================================================================================== */

// ================= 部門設定（真正分流：每個部門各自完整清單） =================
const DEPARTMENTS = {
  construction: {
    key: 'construction', label: '工務部',
    categories: ['場勘', '租客聯繫', '屋主聯繫', '報價', '廠商聯繫', '驗收', '內部會議', '文書作業', '其他'],
    repairRelated: new Set(['驗收', '廠商聯繫']),
  },
  rental: {
    key: 'rental', label: '租賃部',
    // 2026-07-28 補回「其他」：租賃部原始 13 選項沒有它，但同仁需要記休息／用餐等不屬於既有項目的時段
    // （工務部一直都有）。伺服器白名單是工務∪租賃的聯集，本來就收「其他」，只差前端沒顯示。
    categories: ['開發', '委託', '帶看', '簽約', '修繕', '續約', '議價', '請假', '休假', '上課', '活動', '上廣告', '退租點交', '其他'],
    repairRelated: new Set(['修繕']),
  },
  // 2026-08-07 新增：張玉慧實為社宅部（非租賃部，Joan 指正）。項目清單與租賃部完全相同
  // （社宅部同仁 158 筆舊紀錄實際用過的 9 種類別皆是租賃組子集），只是依她的實際使用頻率
  // （續約92／開發34／修繕19 最常用）重新排序，聯集不會多出新選項。
  social_housing: {
    key: 'social_housing', label: '社宅部',
    categories: ['續約', '開發', '修繕', '簽約', '委託', '帶看', '議價', '退租點交', '上廣告', '活動', '上課', '請假', '休假', '其他'],
    repairRelated: new Set(['修繕']),
  },
};
const DEPARTMENT_ORDER = ['construction', 'rental', 'social_housing'];
const OTHER_CATEGORY = '其他';
// Worker 回傳的 categoryGroup 是中文（'工務'／'租賃'／'社宅'／null），對應到本檔的部門 key。
function deptKeyForCategoryGroup(categoryGroup) {
  if (categoryGroup === '工務') return 'construction';
  if (categoryGroup === '租賃') return 'rental';
  if (categoryGroup === '社宅') return 'social_housing';
  return null;
}
function categoriesForIdentity(identity) {
  const deptKey = identity && deptKeyForCategoryGroup(identity.categoryGroup);
  if (deptKey && DEPARTMENTS[deptKey]) return DEPARTMENTS[deptKey].categories;
  // 主管／未分組：聯集去重，依 DEPARTMENT_ORDER 排列，不鎖死某一部門的優先順序。
  const seen = new Set();
  const out = [];
  DEPARTMENT_ORDER.forEach((k) => DEPARTMENTS[k].categories.forEach((c) => { if (!seen.has(c)) { seen.add(c); out.push(c); } }));
  return out;
}
function repairRelatedForIdentity(identity) {
  const deptKey = identity && deptKeyForCategoryGroup(identity.categoryGroup);
  if (deptKey && DEPARTMENTS[deptKey]) return DEPARTMENTS[deptKey].repairRelated;
  const merged = new Set();
  DEPARTMENT_ORDER.forEach((k) => DEPARTMENTS[k].repairRelated.forEach((c) => merged.add(c)));
  return merged;
}

// P1 mock 案名（真實案件清單串接成本較高——需彙整 decor-console/工務報修兩套系統的案名，
// 需新增 Worker 查詢 action，非本輪範圍，見交付摘要「spec 外決定」）。
const MOCK_CASES = [
  '王公館・台中市南屯區文心路三段', '陳宅・彰化縣員林市中山路', '日安大樓 3F・台中市西區精誠路',
  '康橋苑 12F・台中市北屯區崇德路', '松林社區 B棟・彰化縣和美鎮彰南路', '幸福巷弄自宅・台中市大里區國光路',
];

// ================= API 串接（比照 V1 worklog.html 2026-07-25 安全修補版，完整沿用兩道防線） =================
const WORKER_BASE = 'https://wuohome-ragic-proxy.wuohome.workers.dev';
const TOKEN_STORE_KEY = 'wuohome_worklog_v2_token_v1';
function getUrlToken() {
  try { return new URLSearchParams(location.search).get('token') || ''; } catch { return ''; }
}
function resolveToken() {
  const fromUrl = getUrlToken();
  if (fromUrl) {
    try { localStorage.setItem(TOKEN_STORE_KEY, fromUrl); } catch {}
    return fromUrl;
  }
  try { return localStorage.getItem(TOKEN_STORE_KEY) || ''; } catch { return ''; }
}
const API_TOKEN = resolveToken();
const API_MODE = Boolean(API_TOKEN);
// 真實身分一律由 worklogListMine 回應的 viewer 取得，不由前端自行宣告／不提供身分切換 UI——
// token 對應誰、是不是主管、屬於哪個部門，只有 Worker 說了算。
let IDENTITY = null;

const byId = (id) => document.getElementById(id);
function make(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}
const pad = (n) => String(n).padStart(2, '0');
function uid() { return 'x' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4); }

// ================= 時間工具（15 分鐘刻度） =================
const STEP_MINUTES = 15;
function timeToMinutes(t) { if (!t) return null; const [h, m] = t.split(':').map(Number); return h * 60 + m; }
function minutesToTime(mins) { mins = ((Math.round(mins) % 1440) + 1440) % 1440; return `${pad(Math.floor(mins / 60))}:${pad(mins % 60)}`; }
function roundToStep(mins, step) { step = step || STEP_MINUTES; return Math.round(mins / step) * step; }
function floorHour(mins) { return Math.floor(mins / 60) * 60; }
function ceilHour(mins) { return Math.ceil(mins / 60) * 60; }
function nowMinutes() { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); }
function formatDuration(mins) {
  const h = Math.floor(mins / 60), m = mins % 60;
  if (h === 0) return `${m} 分鐘`;
  if (m === 0) return `${h} 小時`;
  return `${h} 小時 ${m} 分`;
}

// ================= 日期（今天／明天／可往回查詢，沿用 V1 已驗證過的跨日鎖定精神） =================
function dateStrForOffset(offsetDays) {
  const d = new Date();
  d.setDate(d.getDate() + offsetDays);
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}
function dateDisplayForOffset(offsetDays) {
  const d = new Date();
  d.setDate(d.getDate() + offsetDays);
  const wd = ['日', '一', '二', '三', '四', '五', '六'][d.getDay()];
  return `${d.getMonth() + 1}/${d.getDate()}（${wd}）`;
}
// 2026-07-25 修復：往回查看無上限會變成無意義的空查詢，上限訂 90 天；往前寫入規則不變
// （後端只允許今天或未來，故 UI 也只開放到「明天」，不因本次開放回看而放寬寫入）。
const NAV_MIN_OFFSET = -90;
const NAV_MAX_OFFSET = 1;
let SELECTED_OFFSET = 0; // 0=今天，正數=未來（僅開放到 1＝明天），負數=過去（唯讀）
function selectedDateStr() { return dateStrForOffset(SELECTED_OFFSET); }
function selectedDateDisplay() { return dateDisplayForOffset(SELECTED_OFFSET); }
function isPastSelected() { return SELECTED_OFFSET < 0; }

// ================= 本機資料（依日期分開存放；API_MODE 下靠 rid 跟 Ragic 對齊） =================
// 形狀：{ [dateStr]: { blocks: { [localId]: Block } } }
const STORAGE_KEY = 'wuohome_worklog_v2_data_v2';
const RECENT_CAT_KEY = 'wuohome_worklog_v2_recent_cat_v1';

function loadAllState() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch { return {}; }
}
function saveAllState(s) { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }
function getDayState(dateStr) {
  const all = loadAllState();
  if (!all[dateStr]) all[dateStr] = { blocks: {} };
  return all[dateStr];
}
function setDayState(dateStr, day) {
  const all = loadAllState();
  all[dateStr] = day;
  saveAllState(all);
}

function loadRecentCats() {
  try { return JSON.parse(localStorage.getItem(RECENT_CAT_KEY)) || []; } catch { return []; }
}
function pushRecentCat(name) {
  if (!name) return;
  const list = [name, ...loadRecentCats().filter((x) => x !== name)].slice(0, 6);
  localStorage.setItem(RECENT_CAT_KEY, JSON.stringify(list));
}
function orderedCategories() {
  const base = categoriesForIdentity(IDENTITY);
  const recent = loadRecentCats().filter((c) => base.includes(c));
  const rest = base.filter((c) => !recent.includes(c));
  return [...recent, ...rest];
}

// ================= Block 資料形狀 =================
// { id, rid(伺服器 row id，尚未送出成功前為 null), start, end, category, otherCategoryText,
//   caseName, repairReason, plannedSchedule, note, synced, saveError }
function blankBlock() {
  return { id: uid(), rid: null, start: '', end: '', category: '', otherCategoryText: '', caseName: '', repairReason: '', plannedSchedule: '', note: '', synced: false, saveError: null, isLegacy: false, legacyHourLabel: null };
}
function isBlockFilled(b) { return !!(b && b.category); }
function blocksList(day) { return Object.values(day.blocks); }
// 舊格式桶籃選項（0900之前／19:00之後）沒有精確起訖時間，排序時給定合理的相對位置：
// 「0900之前」排最前、「19:00之後」排最後，其餘無法辨識的字串保守排在接近末段。
function legacyHourSortHint(hourLabel) {
  if (hourLabel === '0900之前') return -1;
  if (hourLabel === '19:00之後') return 24 * 60 + 1;
  return 24 * 60;
}
function blockSortMinutes(b) {
  const m = timeToMinutes(b.start);
  if (m != null) return m;
  return b.isLegacy ? legacyHourSortHint(b.legacyHourLabel) : 0;
}
function sortedBlocks(day) {
  return blocksList(day).slice().sort((a, b) => blockSortMinutes(a) - blockSortMinutes(b));
}
// 核心價值（Joan 2026-07-25 拍板）：排了但沒做，要自然可見——時段已過、預先排定行程有填，
// 但紀錄內容還空著，代表「排了但沒真的去做／忘了補」，只對「今天」有意義（明天畫面沒有
// 現在進行式，過去日期已鎖定不可再改也無從補救）。
function isOverdueUnrecorded(dateStr, block) {
  if (block.isLegacy) return false; // 舊格式歷史紀錄不適用「排了但沒做」判斷（唯讀呈現即可）
  if (dateStr !== dateStrForOffset(0)) return false;
  // 必須「已經有排定意圖」（項目已選）才算「排了但沒做」；完全空白、使用者才剛點開還沒填
  // 任何東西的新草稿列，不該被當成逾期警示（2026-07-25 agent-browser 實測發現的假陽性）。
  if (!block.end || block.note || !block.category) return false;
  return timeToMinutes(block.end) < nowMinutes();
}

// ================= 建議的預設起訖時間（降低摩擦：接續上一筆結束時間） =================
function suggestedStartTime(day) {
  const filled = blocksList(day).filter((b) => b.start && b.end);
  if (filled.length) {
    const maxEnd = Math.max(...filled.map((b) => timeToMinutes(b.end)));
    return minutesToTime(Math.min(maxEnd, 23 * 60 + 45));
  }
  if (SELECTED_OFFSET === 0) return minutesToTime(Math.min(roundToStep(nowMinutes()), 23 * 60 + 45));
  return '09:00';
}
function suggestedEndTime(startTime) {
  const s = timeToMinutes(startTime);
  return minutesToTime(Math.min(s + 60, 23 * 60 + 45));
}

// ================= 重疊偵測（軟提醒，不阻擋送出） =================
function findOverlaps(day, blockId, start, end) {
  const s = timeToMinutes(start), e = timeToMinutes(end);
  if (s == null || e == null || e <= s) return [];
  return blocksList(day)
    .filter((b) => b.id !== blockId && b.start && b.end)
    .map((b) => {
      const bs = timeToMinutes(b.start), be = timeToMinutes(b.end);
      const os = Math.max(s, bs), oe = Math.min(e, be);
      return oe > os ? { block: b, minutes: oe - os } : null;
    })
    .filter(Boolean);
}
function blockHasOverlap(day, block) {
  if (!block.start || !block.end) return false;
  return findOverlaps(day, block.id, block.start, block.end).length > 0;
}

// ================= Toast（僅用於非關鍵操作回饋；送出失敗一律走持久錯誤框） =================
let toastTimer = null;
function showToast(msg) {
  let t = byId('toast');
  if (!t) {
    t = make('div', 'fixed inset-x-0 bottom-24 z-[60] mx-auto w-fit max-w-[90vw] rounded-full bg-ink px-4 py-2 text-center text-sm font-bold text-white shadow-lg lg:bottom-6');
    t.id = 'toast';
    t.style.opacity = '0';
    document.body.append(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.style.opacity = '0'; }, 2400);
}
function emptyNote(text) {
  return make('div', 'rounded-xl border border-line bg-white p-4 text-center text-sm text-inkmuted', text);
}
function renderFatalError(msg) {
  ['worklog', 'overview'].forEach((v) => { const el = byId('view-' + v); if (el) el.hidden = (v !== 'worklog'); });
  byId('view-worklog').replaceChildren(emptyNote(msg));
  byId('sidebarNav').replaceChildren();
  byId('sidebarPlanned').replaceChildren();
  byId('bottomTabBar').replaceChildren();
  byId('pageTitle').textContent = '無法載入';

// ================= 時間軸視覺化 =================
function computeTimelineWindow(blocks) {
  const filled = blocks.filter((b) => b.start && b.end);
  const starts = filled.map((b) => timeToMinutes(b.start));
  const ends = filled.map((b) => timeToMinutes(b.end));
  const minS = starts.length ? Math.min(...starts, 7 * 60) : 7 * 60;
  const maxE = ends.length ? Math.max(...ends, 20 * 60) : 20 * 60;
  return { start: floorHour(minS), end: ceilHour(maxE) };
}
function buildTimelineSegments(blocks, win) {
  const sorted = blocks.filter((b) => b.start && b.end).slice().sort((a, b) => timeToMinutes(a.start) - timeToMinutes(b.start));
  const segs = [];
  let cursor = win.start;
  sorted.forEach((b) => {
    const s = Math.max(timeToMinutes(b.start), win.start, cursor);
    const e = Math.min(timeToMinutes(b.end), win.end);
    if (e <= s) return;
    if (s > cursor) segs.push({ type: 'gap', start: cursor, end: s });
    segs.push({ type: 'block', start: s, end: e, block: b });
    cursor = Math.max(cursor, e);
  });
  if (cursor < win.end) segs.push({ type: 'gap', start: cursor, end: win.end });
  return segs;
}
function timelineLegendDot(cls, style) {
  const dot = make('span', `inline-block h-3 w-3 shrink-0 rounded-[3px] ${cls}`);
  if (style) Object.assign(dot.style, style);
  return dot;
}
function renderTimelineLegend() {
  const wrap = make('div', 'mt-2 flex flex-wrap gap-x-4 gap-y-1.5');
  const items = [

    { dot: timelineLegendDot('bg-overlap'), label: '時間重疊' },
    { dot: timelineLegendDot('', { backgroundImage: 'repeating-linear-gradient(135deg, #FBF0DC 0 4px, #C81E1E 4px 8px)' }), label: '已排定・尚未補紀錄' },
    { dot: timelineLegendDot('', { backgroundImage: 'repeating-linear-gradient(135deg, var(--c-gap-a) 0 4px, var(--c-gap-b) 4px 8px)' }), label: '空檔（可點擊新增）' },
  ];
  items.forEach((it) => {
    const row = make('span', 'inline-flex items-center gap-1.5 text-[11px] font-bold text-inkmuted');
    row.append(it.dot, make('span', '', it.label));
    wrap.append(row);
  });
  return wrap;
}
function renderTimelineBar(dateStr, day, blocks) {
  const win = computeTimelineWindow(blocks);
  const segs = buildTimelineSegments(blocks, win);
  const totalMin = Math.max(win.end - win.start, 1);

  const wrap = make('div', 'mb-4');
  const track = make('div', 'timeline-track');

  segs.forEach((seg) => {
    const dur = Math.max(seg.end - seg.start, 1);
    if (seg.type === 'gap') {
      const btn = make('button', 'timeline-seg timeline-seg-gap focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-ink');
      btn.type = 'button';
      btn.style.flex = `${dur} 0 0%`;
      btn.setAttribute('aria-label', `${minutesToTime(seg.start)}–${minutesToTime(seg.end)} 沒有紀錄，點擊新增`);
      btn.addEventListener('click', () => addBlock(dateStr, { start: minutesToTime(seg.start), end: minutesToTime(seg.end) }));
      track.append(btn);
    } else {
      const hasOverlap = blockHasOverlap(day, seg.block);
      const overdue = isOverdueUnrecorded(dateStr, seg.block);
      const stateCls = overdue ? 'timeline-seg-overdue' : hasOverlap ? 'timeline-seg-overlap' : (seg.block.synced ? 'timeline-seg-submitted' : 'timeline-seg-pending');
      const catLabel = seg.block.category === OTHER_CATEGORY ? (seg.block.otherCategoryText || '其他') : (seg.block.category || '未填項目');
      const stateText = overdue ? '（已排定・尚未補紀錄）' : hasOverlap ? '（時間重疊）' : seg.block.synced ? '（已送出）' : '（尚未送出）';
      const legacySuffix = seg.block.isLegacy ? '（舊版格式）' : '';
      const btn = make('button', `timeline-seg timeline-seg-block ${stateCls} focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-ink`);
      btn.type = 'button';
      btn.style.flex = `${dur} 0 0%`;
      btn.setAttribute('aria-label', `${seg.block.start}–${seg.block.end} ${catLabel}${stateText}${legacySuffix}`);
      btn.addEventListener('click', () => {
        // 舊格式紀錄唯讀呈現，不展開成編輯表單，只捲動過去讓使用者看到。
        if (!seg.block.isLegacy) EXPANDED_BLOCKS.add(seg.block.id);
        renderWorklogView();
        requestAnimationFrame(() => {
          const el = byId(`row-block-${seg.block.id}`);
          if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        });
      });
      track.append(btn);
    }
  });

  if (SELECTED_OFFSET === 0) {
    const now = nowMinutes();
    if (now >= win.start && now <= win.end) {
      const pct = ((now - win.start) / totalMin) * 100;
      const marker = make('div', 'timeline-now-marker');
      marker.style.left = `${pct}%`;
      const dot = make('div', 'timeline-now-dot');
      dot.style.left = `${pct}%`;
      const markerWrap = make('div', 'relative');
      markerWrap.append(track, marker, dot);
      wrap.append(markerWrap);
      wrap.append(renderTimelineLegend());
      return wrap;
    }
  }
  wrap.append(track);
  wrap.append(renderTimelineLegend());
  return wrap;
}

// ================= 時間選擇（自訂「時：分」下拉，取代 input[type=time]） =================
// 桌面瀏覽器的原生 time 輸入會跟著作業系統語系跑出「上午／下午」，同仁反映不好填也容易選錯；
// 手機叫的是系統選擇器所以沒這問題。改用兩個下拉自己畫，兩邊都固定 24 小時制、15 分刻度，
// 送出格式仍是 "HH:MM"，資料層（commitTime／Ragic startTime,endTime）完全不變。
function timeSelectField(value, onCommit) {
  const wrap = make('div', 'mt-1 flex items-center gap-1');
  const hourSel = make('select', 'time-part min-w-0 flex-1');
  const minSel = make('select', 'time-part min-w-0 flex-1');
  const addOpt = (sel, val, label) => { const o = make('option', null, label); o.value = val; sel.append(o); };

  const cur = /^\d{1,2}:\d{2}$/.test(value || '') ? value.split(':') : ['', ''];
  const curHour = cur[0] ? pad(Number(cur[0])) : '';
  const curMin = cur[1] ? pad(Number(cur[1])) : '';

  addOpt(hourSel, '', '時');
  for (let h = 0; h < 24; h++) addOpt(hourSel, pad(h), pad(h));
  addOpt(minSel, '', '分');
  for (let m = 0; m < 60; m += STEP_MINUTES) addOpt(minSel, pad(m), pad(m));
  // 舊資料若不是 15 分刻度（例如 V1 相容紀錄），補一個該值的選項，避免下拉顯示空白把時間洗掉
  if (curMin && Number(curMin) % STEP_MINUTES !== 0) addOpt(minSel, curMin, curMin);
  hourSel.value = curHour;
  minSel.value = curMin;

  function emit() {
    if (!hourSel.value) {
      if (!minSel.value) onCommit('');   // 兩邊都清空才算清掉這格時間
      return;                            // 只選了分還沒選時：先不寫回，也不重繪，讓使用者把時選完
    }
    if (!minSel.value) minSel.value = '00';
    onCommit(`${hourSel.value}:${minSel.value}`);
  }
  hourSel.addEventListener('change', emit);
  minSel.addEventListener('change', emit);

  wrap.append(hourSel, make('span', 'shrink-0 text-sm font-bold text-inkmuted', ':'), minSel);
  return wrap;
}

function timeAdjustRow(getEnd, setEnd, rerender) {

// ================= 送出【其他】前綴組裝／還原（比照 V1 既有慣例，讀寫一致） =================
function buildNoteForSubmit(block) {
  return block.category === OTHER_CATEGORY && block.otherCategoryText
    ? `【${block.otherCategoryText}】${block.note || ''}`.trim()
    : (block.note || '');
}

// ================= V1 舊格式相容（唯讀顯示，不可編輯／不寫回 Ragic，見踩坑速查對應條目） =================
// V1「時間(小時)」(fid 1003095) 是下拉選項字串；V2 上線（2026-07-25 新增 startTime/endTime 欄位）
// 之前的所有真實歷史紀錄都是這個格式。中段 9 個選項是「HH:MM-HH:MM」可解析成起訖時間，直接讓它
// 正常排序、畫進時間軸；頭尾「0900之前／19:00之後」是無法還原精確時間的桶籃選項，仍要在清單顯示
// （用原字串當時段文字），但不勉強塞進時間軸。
const LEGACY_HOUR_RANGE_RE = /^(\d{2}):(\d{2})-(\d{2}):(\d{2})$/;
function parseLegacyHourRange(hour) {
  const m = LEGACY_HOUR_RANGE_RE.exec((hour || '').trim());
  return m ? { start: `${m[1]}:${m[2]}`, end: `${m[3]}:${m[4]}` } : null;
}
function parseApiEntry(rec) {
  const isLegacy = !(rec.startTime && rec.endTime);
  let start = rec.startTime || '';
  let end = rec.endTime || '';
  let legacyHourLabel = null;
  if (isLegacy) {
    const parsed = parseLegacyHourRange(rec.hour);
    if (parsed) { start = parsed.start; end = parsed.end; }
    else legacyHourLabel = rec.hour || '';
  }
  let category = rec.category || '';
  let otherCategoryText = '';
  let note = rec.note || '';
  if (category === OTHER_CATEGORY) {
    const m = /^【([^】]*)】([\s\S]*)$/.exec(note);
    if (m) { otherCategoryText = m[1]; note = m[2]; }
  }
  return {
    id: 'r' + rec.rid, rid: rec.rid,
    start, end, category, otherCategoryText, note,
    caseName: rec.caseName || '', repairReason: rec.repairReason || '', plannedSchedule: rec.plannedSchedule || '',
    synced: true, saveError: null,
    isLegacy, legacyHourLabel,
  };
}

// 2026-07-24 事故教訓（V1 同款修復，V2 沿用同一原則）：Ragic 回什麼、不能無條件覆寫本機——
// Ragic 有的（有 rid）視為已送出真相採用；本機還有「沒有 rid、但已經填寫」的草稿，代表
// 尚未成功送出，必須保留不清除，交給 UI 用「尚未送出」徽章讓使用者自己看得到。
// 2026-07-25 修復：V1 舊格式（hour 小時格、無 startTime/endTime）的紀錄改由 parseApiEntry
// 判斷格式並標記 isLegacy，不再整批過濾掉（見上方「V1 舊格式相容」區塊）。
function applyMineData(json, dateStr) {
  const existing = getDayState(dateStr);
  const day = { blocks: {} };
  (json.entries || []).forEach((rec) => {
    const b = parseApiEntry(rec);
    day.blocks[b.id] = b;
  });
  Object.entries(existing.blocks || {}).forEach(([id, b]) => {
    if (!b.rid && isBlockFilled(b) && !day.blocks[id]) day.blocks[id] = { ...b, synced: false };
  });
  setDayState(dateStr, day);
}

async function loadMineFromApi(dateParam) {
  try {
    const qs = dateParam ? `&date=${encodeURIComponent(dateParam)}` : '';
    const res = await fetch(`${WORKER_BASE}/worklogListMine?token=${encodeURIComponent(API_TOKEN)}${qs}`);
    let json = null;
    try { json = await res.json(); } catch { json = null; }
    if (!res.ok || !json || json.ok !== true) return { ok: false, status: res.status };
    return { ok: true, json };
  } catch {
    return { ok: false, status: 0 };
  }
}

const LOADED_DATE_KEYS = new Set();
let dateSwitchReqId = 0;
async function switchSelectedDate(offset) {
  offset = Math.max(NAV_MIN_OFFSET, Math.min(NAV_MAX_OFFSET, offset));
  if (SELECTED_OFFSET === offset) return;
  const myReqId = ++dateSwitchReqId;
  SELECTED_OFFSET = offset;
  EXPANDED_BLOCKS = new Set();
  if (API_MODE && !LOADED_DATE_KEYS.has(offset)) {
    renderWorklogView();
    const result = await loadMineFromApi(offset === 0 ? null : selectedDateStr());
    if (myReqId !== dateSwitchReqId) return;
    LOADED_DATE_KEYS.add(offset);
    if (result.ok) applyMineData(result.json, selectedDateStr());
  }
  renderWorklogView();
}

// ================= 實際紀錄區塊：新增／編輯／儲存（逐筆立即送出真實 API） =================
async function saveBlock(dateStr, blockId, btn) {
  const day = getDayState(dateStr);
  const block = day.blocks[blockId];
  if (!block) return;
  if (!block.category) { showToast('請先選擇項目再儲存'); return; }
  const s = timeToMinutes(block.start), e = timeToMinutes(block.end);
  if (s == null || e == null) { showToast('請填寫開始與結束時間'); return; }
  if (e <= s) { showToast('結束時間必須晚於開始時間'); return; }

  btn.disabled = true;
  btn.textContent = '儲存中…';
  block.saveError = null;

  if (!API_MODE) {
    // 開發模擬模式（網址帶 ?dev=1、無 token）：方便除錯 UI，不呼叫真實 API。
    setTimeout(() => {
      block.synced = true; block.saveError = null;
      setDayState(dateStr, day);
      EXPANDED_BLOCKS.delete(blockId);
      renderWorklogView();
      showToast('已儲存（本機模擬，未連線 API）');
    }, 450);
    return;
  }

  const entry = {
    startTime: block.start, endTime: block.end, category: block.category,
    caseName: block.caseName || '', repairReason: block.repairReason || '',
    plannedSchedule: block.plannedSchedule || '', note: buildNoteForSubmit(block),
  };
  if (block.rid) entry.rid = block.rid;

  try {
    const res = await fetch(`${WORKER_BASE}/worklogCreate?token=${encodeURIComponent(API_TOKEN)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ entries: [entry], date: dateStr }),
    });
    const json = await res.json().catch(() => null);
    const r = (json && Array.isArray(json.results)) ? json.results[0] : null;
    if (!res.ok || !json || !r || !r.ok) {
      const message = r && r.error
        ? `送出失敗：${r.error}`
        : (json && json.error) ? `送出失敗：${json.error}` : '送出失敗，請稍後再試或截圖回報';
      block.saveError = message;
      block.synced = false;
      setDayState(dateStr, day);
      renderWorklogView();
      return;
    }
    block.rid = r.rid || block.rid;
    block.synced = true;
    block.saveError = null;
    setDayState(dateStr, day);
    EXPANDED_BLOCKS.delete(blockId);
    renderWorklogView();
  } catch (err) {
    block.saveError = '連線失敗，請檢查網路後重試（內容仍保留在草稿中，未遺失）';
    block.synced = false;
    setDayState(dateStr, day);
    renderWorklogView();
  }
}

  requestAnimationFrame(() => {
    const el = byId(`row-block-${b.id}`);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });

  return b.id;
}

    line.append(block.synced
      ? make('span', 'inline-flex shrink-0 items-center gap-0.5 rounded-full bg-submitted px-2 py-0.5 text-xs font-bold text-white', '✓ 已送出')
      : make('span', 'inline-block shrink-0 rounded-full border-2 border-pending bg-pendingtint px-2 py-0.5 text-xs font-bold text-pendingdark', '尚未送出'));
    if (overdue) line.append(make('span', 'inline-block shrink-0 rounded-full border-2 border-overlap bg-overlaptint px-2 py-0.5 text-xs font-bold text-overlapdark', '⏰ 已排定・尚未補紀錄'));
    if (hasOverlap) {
      const overlaps = findOverlaps(day, block.id, block.start, block.end);
      const otherLabel = overlaps.length === 1
        ? (overlaps[0].block.category === OTHER_CATEGORY ? (overlaps[0].block.otherCategoryText || '其他') : overlaps[0].block.category)
        : `${overlaps.length} 筆`;
      line.append(make('span', 'inline-block shrink-0 rounded-full border-2 border-overlap bg-overlaptint px-2 py-0.5 text-xs font-bold text-overlapdark', `⚠ 與 ${otherLabel} 重疊`));
    }
    if (block.caseName) line.append(make('span', 'truncate text-sm font-bold text-ink', block.caseName));
    previewCol.append(line);
    if (block.plannedSchedule && !block.note) previewCol.append(make('p', 'mt-0.5 truncate text-xs text-inkmuted', `預計：${block.plannedSchedule}`));
    if (block.repairReason) previewCol.append(make('p', 'mt-0.5 truncate text-xs text-inkmuted', `報修原因：${block.repairReason}`));
  } else {
    previewCol.append(make('p', 'text-sm text-inkmuted', '尚未填寫項目'));
  }
  headerBtn.append(previewCol);
  headerBtn.append(expandHintPill(expanded, filled));
  headerBtn.addEventListener('click', () => { if (EXPANDED_BLOCKS.has(block.id)) EXPANDED_BLOCKS.delete(block.id); else EXPANDED_BLOCKS.add(block.id); renderWorklogView(); });
  wrap.append(headerBtn);

  if (!expanded) return wrap;

  const form = make('div', 'space-y-3 border-t border-line px-3 pb-3 pt-3');

  // 起訖各自是「時：分」兩個下拉，四個框並排；組間留大間距，才看得出哪兩個是同一組
  const timeRow = make('div', 'grid grid-cols-2 gap-4');
  const startWrap = make('div');
  startWrap.append(fieldLabel('開始時間'));
  startWrap.append(timeSelectField(block.start, (val) => { commitTime('start', val); renderWorklogView(); }));
  const endWrap = make('div');
  endWrap.append(fieldLabel('結束時間'));
  endWrap.append(timeSelectField(block.end, (val) => { commitTime('end', val); renderWorklogView(); }));
  timeRow.append(startWrap, endWrap);
  form.append(timeRow);

  function commitTime(field, val) {
    const d = getDayState(dateStr);
    const b = d.blocks[block.id];
    if (!b) return;
    b[field] = val ? minutesToTime(roundToStep(timeToMinutes(val))) : '';
    setDayState(dateStr, d);
  }

  form.append(timeAdjustRow(
    () => getDayState(dateStr).blocks[block.id].end || block.start,
    (val) => commitTime('end', val),
    renderWorklogView,
  ));

  const overlapBox = overlapWarningBox(getDayState(dateStr), getDayState(dateStr).blocks[block.id]);
  if (overlapBox) form.append(overlapBox);

  form.append(fieldLabel('項目'));
  form.append(categoryGrid(block, (name) => {
    const d = getDayState(dateStr);
    const b = d.blocks[block.id];
    b.category = name;
    if (name !== OTHER_CATEGORY) b.otherCategoryText = '';
    setDayState(dateStr, d);
    pushRecentCat(name);
    renderWorklogView();
  }));

  const otherWrap = make('div', 'accordion grid');
  otherWrap.style.gridTemplateRows = block.category === OTHER_CATEGORY ? '1fr' : '0fr';
  const otherInner = make('div', 'accordion-inner');
  const otherLabelEl = make('label', 'block pt-2 text-xs font-bold text-inkmuted', '其他項目名稱（請簡短說明）');
  const otherInput = make('input', 'mt-1 block w-full rounded-lg border border-line px-2 text-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ink');
  otherInput.type = 'text';
  otherInput.placeholder = '例如：搬運材料、等待廠商';
  otherInput.value = block.otherCategoryText || '';
  otherInput.addEventListener('input', () => { const d = getDayState(dateStr); d.blocks[block.id].otherCategoryText = otherInput.value; setDayState(dateStr, d); });
  otherLabelEl.append(otherInput);
  otherInner.append(otherLabelEl);
  otherWrap.append(otherInner);
  form.append(otherWrap);

  const caseLabelEl = fieldLabel('案名/地址（選填）');
  const caseInput = make('input', 'mt-1 block w-full rounded-lg border border-line px-2 text-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ink');
  caseInput.type = 'text';
  caseInput.placeholder = '輸入或從既有案件挑選，沒有可留空';
  caseInput.setAttribute('list', 'worklogCaseList');
  caseInput.value = block.caseName || '';
  caseInput.addEventListener('input', () => { const d = getDayState(dateStr); d.blocks[block.id].caseName = caseInput.value; setDayState(dateStr, d); });
  caseLabelEl.append(caseInput);
  form.append(caseLabelEl);

  const repairSet = repairRelatedForIdentity(IDENTITY);
  const repairWrap = make('div', 'accordion grid');
  repairWrap.style.gridTemplateRows = repairSet.has(block.category) ? '1fr' : '0fr';
  const repairInner = make('div', 'accordion-inner');
  const repairLabelEl = make('label', 'block pt-3 text-xs font-bold text-inkmuted', '報修原因（選填）');
  const repairInput = make('input', 'mt-1 block w-full rounded-lg border border-line px-2 text-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ink');
  repairInput.type = 'text';
  repairInput.placeholder = '例如：浴室天花板漏水複驗';
  repairInput.value = block.repairReason || '';
  repairInput.addEventListener('input', () => { const d = getDayState(dateStr); d.blocks[block.id].repairReason = repairInput.value; setDayState(dateStr, d); });
  repairLabelEl.append(repairInput);
  repairInner.append(repairLabelEl);
  repairWrap.append(repairInner);
  form.append(repairWrap);

  // 預先排定行程（早上先填，跟紀錄內容共用同一筆——這是本次資料模型的核心設計）
  const planLabelEl = fieldLabel('預先排定行程（選填・建議上午先填）');
  const planInput = make('input', 'mt-1 block w-full rounded-lg border border-line px-2 text-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ink');
  planInput.type = 'text';
  planInput.placeholder = '例如：原本排定 10 點去王公館驗收';
  planInput.value = block.plannedSchedule || '';
  planInput.addEventListener('input', () => { const d = getDayState(dateStr); d.blocks[block.id].plannedSchedule = planInput.value; setDayState(dateStr, d); });
  planLabelEl.append(planInput);
  form.append(planLabelEl);

  // 紀錄內容（下班前補齊）
  const noteLabelEl = fieldLabel('紀錄內容（選填・建議下班前補齊，簡短就好）');
  const noteTextarea = make('textarea', 'mt-1 block w-full rounded-lg border border-line px-2 py-2 text-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ink');
  noteTextarea.rows = 2;
  noteTextarea.maxLength = 150;
  noteTextarea.placeholder = '這段時間實際發生的細節，例如：完成客廳插座配線';
  noteTextarea.value = block.note || '';
  const counter = make('p', 'tnum mt-1 text-right text-[11px] text-inkfaint', `${noteTextarea.value.length}/150`);
  noteTextarea.addEventListener('input', () => {
    const d = getDayState(dateStr);
    d.blocks[block.id].note = noteTextarea.value;
    setDayState(dateStr, d);
    counter.textContent = `${noteTextarea.value.length}/150`;
  });
  noteLabelEl.append(noteTextarea);
  form.append(noteLabelEl, counter);

  if (block.saveError) {
    const errBox = make('div', 'rounded-lg border-2 border-red-300 bg-red-50 px-3 py-2');
    errBox.append(make('p', 'text-xs font-black text-red-700', '上次儲存失敗，內容還在，請確認後重試'));
    errBox.append(make('p', 'mt-0.5 text-xs text-red-600', block.saveError));
    form.append(errBox);
  }

  const actionsRow = make('div', 'flex flex-wrap items-center gap-2 pt-1');
  const saveBtn = make('button', 'tap44 rounded-xl bg-coral px-4 text-sm font-black text-white transition-transform hover:bg-coraldark active:scale-[0.97] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ink', block.saveError ? '重試儲存' : (block.synced ? '重新儲存' : '儲存這筆'));
  saveBtn.type = 'button';
  saveBtn.addEventListener('click', () => saveBlock(dateStr, block.id, saveBtn));
  actionsRow.append(saveBtn);

  if (!block.synced) {
    const delBtn = make('button', 'tap44 rounded-lg border border-line px-3 text-xs font-bold text-inkmuted hover:bg-paper focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ink', '刪除這筆');
    delBtn.type = 'button';
    delBtn.addEventListener('click', () => { if (confirm('刪除這筆尚未送出的草稿？')) deleteBlock(dateStr, block.id); });
    actionsRow.append(delBtn);
  }
  actionsRow.append(make('span', 'flex-1'));
  const collapseBtn = make('button', 'tap44 rounded-lg px-3 text-xs font-bold text-inkmuted hover:bg-paper focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ink', '收合');
  collapseBtn.type = 'button';
  collapseBtn.addEventListener('click', () => { EXPANDED_BLOCKS.delete(block.id); renderWorklogView(); });
  actionsRow.append(collapseBtn);
  form.append(actionsRow);

  wrap.append(form);
  return wrap;
}

// ================= 日期導覽（同仁填寫頁／主管總覽共用；2026-07-25 修復：開放往回查看） =================
// 往回無上限會變成無意義的空查詢，故 offset 夾在 [NAV_MIN_OFFSET, NAV_MAX_OFFSET]；
// 邊界一律用 disabled 呈現（非 toast 擋下），讓使用者一眼看出還能不能繼續按。
function dateNavRow(offset, onChange) {
  const wrap = make('div', 'mb-4 flex flex-wrap items-center gap-2');

  const atMin = offset <= NAV_MIN_OFFSET;
  const prevBtn = make('button', `tap44 rounded-lg border-2 border-line px-3 text-sm font-bold text-ink hover:bg-paper focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ink${atMin ? ' cursor-not-allowed opacity-40' : ''}`, '‹ 前一天');
  prevBtn.type = 'button';
  prevBtn.disabled = atMin;
  if (atMin) prevBtn.title = `最多只能往回看 ${-NAV_MIN_OFFSET} 天`;
  prevBtn.addEventListener('click', () => onChange(offset - 1));
  wrap.append(prevBtn);

  wrap.append(make('span', 'tnum rounded-lg bg-paper px-3 py-2 text-sm font-black text-ink', dateDisplayForOffset(offset)));

  const atMax = offset >= NAV_MAX_OFFSET;
  const nextBtn = make('button', `tap44 rounded-lg border-2 border-line px-3 text-sm font-bold text-ink hover:bg-paper focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ink${atMax ? ' cursor-not-allowed opacity-40' : ''}`, '後一天 ›');
  nextBtn.type = 'button';
  nextBtn.disabled = atMax;
  if (atMax) nextBtn.title = '目前只開放排到明天';
  nextBtn.addEventListener('click', () => onChange(offset + 1));
  wrap.append(nextBtn);

  const pillGroup = make('div', 'inline-flex gap-1 rounded-xl border-2 border-line bg-white p-1');
  [{ off: 0, label: '今天' }, { off: 1, label: '明天' }].forEach((opt) => {
    const active = offset === opt.off;
    const btn = make('button', `tap44 rounded-lg px-3 text-sm font-black transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ink ${active ? 'bg-coral text-white' : 'text-inkmuted hover:bg-paper'}`, opt.label);
    btn.type = 'button';
    btn.addEventListener('click', () => onChange(opt.off));
    pillGroup.append(btn);
  });
  wrap.append(pillGroup);

  if (offset !== 0) {
    const todayBtn = make('button', 'tap44 rounded-lg bg-ink px-3 text-sm font-black text-white hover:bg-ink/90 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ink', '回到今天');
    todayBtn.type = 'button';
    todayBtn.addEventListener('click', () => onChange(0));
    wrap.append(todayBtn);
  }
  return wrap;
}

function renderWorklogView() {
  const root = byId('view-worklog');
  root.replaceChildren();
  const dateStr = selectedDateStr();
  const day = getDayState(dateStr);
  const isTomorrow = SELECTED_OFFSET === 1;
  const isPast = isPastSelected();

  const deptKey = IDENTITY && deptKeyForCategoryGroup(IDENTITY.categoryGroup);
  const head = make('div', 'mb-4');
  head.append(make('p', 'text-xs font-bold tracking-wide text-coraldark', `${deptKey ? DEPARTMENTS[deptKey].label : '窩的家'}・自訂起訖時間`));
  head.append(make('h2', 'text-xl font-black text-ink sm:text-2xl', isPast ? `${selectedDateDisplay()} 的紀錄` : isTomorrow ? '明天，你打算做什麼？' : '今天，你在忙什麼？'));
  head.append(make('p', 'mt-1 text-sm text-inkmuted', isPast
    ? `${selectedDateDisplay()}・這天已鎖定不可修改，僅供查看。`
    : isTomorrow
      ? `${selectedDateDisplay()}・先列幾筆明天的計畫（填「預先排定行程」即可），時間到了再回來補實際紀錄。`
      : `${selectedDateDisplay()}・想幾點記就幾點記；早上先排大概行程（填「預先排定行程」），下班前回來把「紀錄內容」補齊——同一筆補、不用重填。`));
  root.append(head);
  root.append(dateNavRow(SELECTED_OFFSET, switchSelectedDate));

  // 過去日期：後端規則是「今天或未來可寫，過去一律拒絕」，前端必須同步鎖成純唯讀——
  // 不顯示任何輸入欄位／新增／儲存類按鈕，避免使用者打字後才被拒絕（7/24 資料遺失事故同款傷害）。
  if (isPast) {
    root.append(make('div', 'mb-4 rounded-xl border-2 border-line bg-paper px-4 py-2.5 text-sm font-black text-ink',
      `🔒 這是 ${selectedDateDisplay()} 的紀錄，已鎖定不可修改`));
    const list = make('div', 'space-y-2');
    const blocks = sortedBlocks(day);
    if (blocks.length === 0) {
      list.append(emptyNote(`${selectedDateDisplay()} 這天沒有紀錄。`));
    } else {
      blocks.forEach((b) => list.append(memberEntryLine(dateStr, b, true)));
    }
    root.append(list);
    return;
  }

  const unsyncedFilled = blocksList(day).filter((b) => isBlockFilled(b) && !b.synced);
  if (unsyncedFilled.length > 0) {
    root.append(make('div', 'mb-4 rounded-xl border-2 border-pending bg-pendingtint px-4 py-2.5 text-sm font-black text-pendingdark',
      `⚠ 你有 ${unsyncedFilled.length} 筆已經填寫但還沒送出成功，展開後按「儲存這筆」才會真的存進系統`));
  }
  const overdueList = blocksList(day).filter((b) => isOverdueUnrecorded(dateStr, b));
  if (!isTomorrow && overdueList.length > 0) {
    root.append(make('div', 'mb-4 rounded-xl border-2 border-overlap bg-overlaptint px-4 py-2.5 text-sm font-black text-overlapdark',
      `⏰ 有 ${overdueList.length} 筆時段已過但「紀錄內容」還空著，記得回頭補一下`));
  }

  const quickRow = make('div', 'mb-4 flex flex-wrap gap-2');
  const addBtn = make('button', 'tap44 rounded-xl bg-coral px-4 text-sm font-black text-white transition-transform hover:bg-coraldark active:scale-[0.97] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ink', '+ 新增一筆');
  addBtn.type = 'button';
  addBtn.addEventListener('click', () => addBlock(dateStr));
  const fullDayBtn = make('button', 'tap44 rounded-xl border-2 border-line px-4 text-sm font-bold text-ink hover:bg-paper focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ink', '整天都在忙同一件事');
  fullDayBtn.type = 'button';
  fullDayBtn.addEventListener('click', () => addFullDayBlock(dateStr));
  quickRow.append(addBtn, fullDayBtn);
  root.append(quickRow);

  const blocks = blocksList(day);
  root.append(renderTimelineBar(dateStr, day, blocks));

  root.append(make('h3', 'mb-2 text-sm font-black text-ink', '今天的紀錄'));
  const list = make('div', 'space-y-2');
  if (blocks.length === 0) {
    list.append(emptyNote('還沒有任何紀錄，點上面「+ 新增一筆」開始。'));
  } else {
    // 舊格式紀錄（V1 hour 小時格，理論上只會出現在 V1/V2 並存過渡期間的同一天）一律唯讀呈現，
    // 不進 renderBlockRow 編輯表單。
    sortedBlocks(day).forEach((b) => list.append(b.isLegacy ? memberEntryLine(dateStr, b, true) : renderBlockRow(dateStr, day, b)));
  }
  root.append(list);

  const stillUnsynced = blocksList(day).filter((b) => isBlockFilled(b) && !b.synced);
  if (stillUnsynced.length > 0) {
    root.append(make('div', 'h-4'));
    const retryBar = make('div', 'rounded-xl border-2 border-pending bg-white px-4 py-3');
    const row = make('div', 'flex items-center justify-between gap-3');
    row.append(make('p', 'text-sm font-bold text-pendingdark', `還有 ${stillUnsynced.length} 筆尚未送出成功`));
    const retryAllBtn = make('button', 'tap44 shrink-0 rounded-xl bg-ink px-4 text-sm font-black text-white hover:bg-ink/90 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ink', '全部重試送出');
    retryAllBtn.type = 'button';
    retryAllBtn.addEventListener('click', async () => {
      retryAllBtn.disabled = true;
      retryAllBtn.textContent = '送出中…';
      for (const b of stillUnsynced) {
        // eslint-disable-next-line no-await-in-loop
        await saveBlock(dateStr, b.id, retryAllBtn);
      }
      renderWorklogView();
    });
    row.append(retryAllBtn);
    retryBar.append(row);
    root.append(retryBar);
  }
}

// ================= 主管總覽（唯讀，真實 API） =================
let OVERVIEW_DATE_OFFSET = 0;
function overviewOffsetDateStr() { return dateStrForOffset(OVERVIEW_DATE_OFFSET); }
function overviewOffsetDateDisplay() { return dateDisplayForOffset(OVERVIEW_DATE_OFFSET); }

// withRowId：同仁填寫頁需要 row-block-<id> 這個 DOM id 給時間軸點擊/捲動定位用；
// 主管總覽不需要（避免跟同仁頁的 id 撞在一起），預設不加。
function memberEntryLine(dateStr, b, withRowId) {
  const wrap = make('div', 'rounded-lg bg-paper p-2.5 text-sm');
  if (withRowId) wrap.id = `row-block-${b.id}`;
  const top = make('p', 'flex flex-wrap items-center gap-1.5');
  const timeLabel = (b.start && b.end) ? `${b.start}–${b.end}` : (b.isLegacy && b.legacyHourLabel) ? b.legacyHourLabel : '（時段未知）';
  top.append(make('span', 'tnum text-xs font-bold text-inkfaint', timeLabel));
  const entryLabel = categoryLabelOf(b);
  top.append(make('span', `rounded-full border px-2 py-0.5 text-xs font-bold ${categoryToneClass(entryLabel)}`, entryLabel));
  if (b.isLegacy) top.append(make('span', 'rounded-full border border-inkfaint/50 bg-white px-2 py-0.5 text-[10px] font-bold text-inkfaint', '舊版格式'));
  if (isOverdueUnrecorded(dateStr, b)) top.append(make('span', 'rounded-full border-2 border-overlap bg-overlaptint px-2 py-0.5 text-xs font-bold text-overlapdark', '⏰ 已排定・尚未補紀錄'));
  if (b.caseName) top.append(make('span', 'text-ink', b.caseName));
  wrap.append(top);
  if (b.repairReason) wrap.append(make('p', 'mt-1 text-xs text-inkmuted', `報修原因：${b.repairReason}`));
  if (b.plannedSchedule) wrap.append(make('p', 'mt-0.5 text-xs text-inkmuted', `預先排定：${b.plannedSchedule}`));
  if (b.note) wrap.append(make('p', 'mt-0.5 text-xs text-ink', b.note));
  return wrap;
}
// 標題列項目標籤：主管不展開卡片也能看到今天有哪些項目，待補的那一項直接標紅
// （狀態徽章只給得出「1 筆待補」的數量，說不出是哪一項）。
const HEAD_TAG_MAX = 6;

// 項目標籤配色：22 個項目依性質分成 6 組（同組同色），色相拉開到一眼能分。
// 配色 C「工地強光高對比」的做法沿用：淺底＋深字＋同色描邊，不用低對比粉彩。
// 全組一律避開紅色系——紅色只留給「已排定・尚未補紀錄」的警示標籤，不能被搶掉。
const CATEGORY_TONES = {
  field: 'border-[#6FC3AC] bg-[#D9F2EA] text-[#0A5A46]', // 現場作業
  contact: 'border-[#93A6EE] bg-[#E4E9FB] text-[#2A3C96]', // 對外聯繫
  deal: 'border-[#C297DC] bg-[#F0E4F8] text-[#632E86]', // 成交合約
  office: 'border-[#9FB6BF] bg-[#E6EDF0] text-[#35525E]', // 內務行政
  off: 'border-[#EFAF77] bg-[#FCE9D9] text-[#8A4200]', // 不在崗
  learn: 'border-[#DB9BD0] bg-[#F7E3F2] text-[#7A2168]', // 教育訓練／活動
  other: 'border-line bg-paper text-inkmuted', // 其他／自訂項目
};
const CATEGORY_TONE_OF = {
  場勘: 'field', 帶看: 'field', 驗收: 'field', 修繕: 'field', 退租點交: 'field',
  租客聯繫: 'contact', 屋主聯繫: 'contact', 廠商聯繫: 'contact', 開發: 'contact', 委託: 'contact', 議價: 'contact',
  報價: 'deal', 簽約: 'deal', 續約: 'deal',
  內部會議: 'office', 文書作業: 'office', 上廣告: 'office',
  請假: 'off', 休假: 'off',
  上課: 'learn', 活動: 'learn',
};
function categoryToneClass(label) {
  return CATEGORY_TONES[CATEGORY_TONE_OF[label]] || CATEGORY_TONES.other;
}
function categoryLabelOf(b) {
  return b.category === OTHER_CATEGORY ? (b.otherCategoryText || '其他') : (b.category || '未填項目');
}
function headTagsForMember(dateStr, member) {
  const map = new Map();
  member.blocks.slice().sort((a, b) => blockSortMinutes(a) - blockSortMinutes(b)).forEach((b) => {
    const label = categoryLabelOf(b);
    const overdue = isOverdueUnrecorded(dateStr, b);
    if (!map.has(label)) map.set(label, { label, overdue });
    else if (overdue) map.get(label).overdue = true;
  });
  return [...map.values()];
}
function memberCard(dateStr, member) {
  const total = member.blocks.length;
  const overdueCount = member.blocks.filter((b) => isOverdueUnrecorded(dateStr, b)).length;
  const expanded = EXPANDED_MEMBER === member.id;
  const statusText = total === 0 ? '今日尚無紀錄' : (overdueCount > 0 ? `已記 ${total} 筆・${overdueCount} 筆待補紀錄` : `已記 ${total} 筆`);
  const statusCls = total === 0 ? 'border border-line bg-white text-inkmuted' : overdueCount > 0 ? 'bg-overlap text-white' : 'bg-coral text-white';

  const card = make('div', 'rounded-2xl border border-line bg-white');
  const headerBtn = make('button', `tap44 flex w-full flex-wrap items-center justify-between gap-x-3 gap-y-2 px-4 py-3.5 text-left transition-colors hover:bg-paper active:bg-paper focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ink ${expanded ? 'rounded-t-2xl' : 'rounded-2xl'}`);
  headerBtn.type = 'button';
  headerBtn.append(make('span', 'order-1 shrink-0 text-sm font-black text-ink', member.label));
  // 標籤列：窄螢幕排到姓名下方整行（order-3），sm 以上回到姓名與狀態徽章中間同一行。
  const headTags = headTagsForMember(dateStr, member);
  if (headTags.length > 0) {
    const tagRow = make('div', 'order-3 flex w-full min-w-0 flex-wrap items-center gap-1.5 sm:order-2 sm:w-auto sm:flex-1');
    headTags.slice(0, HEAD_TAG_MAX).forEach((t) => {
      tagRow.append(make('span',
        t.overdue
          ? 'rounded-full border-2 border-overlap bg-overlaptint px-2 py-0.5 text-xs font-bold text-overlapdark'
          : `rounded-full border px-2 py-0.5 text-xs font-bold ${categoryToneClass(t.label)}`,
        t.overdue ? `⏰ ${t.label}` : t.label));
    });
    if (headTags.length > HEAD_TAG_MAX) {
      tagRow.append(make('span', 'rounded-full border border-line bg-paper px-2 py-0.5 text-xs font-bold text-inkfaint', `+${headTags.length - HEAD_TAG_MAX}`));
    }
    headerBtn.append(tagRow);
  }
  const right = make('div', 'order-2 flex shrink-0 items-center gap-2 sm:order-3');
  right.append(make('span', `rounded-full px-2.5 py-1 text-xs font-bold ${statusCls}`, statusText));
  const chevWrap = make('span', 'flex h-7 w-7 shrink-0 items-center justify-center rounded-full border-2 border-line bg-white text-ink');
  chevWrap.innerHTML = expanded ? CHEVRON_UP_SVG : CHEVRON_DOWN_SVG;
  right.append(chevWrap);
  headerBtn.append(right);
  headerBtn.addEventListener('click', () => { EXPANDED_MEMBER = expanded ? null : member.id; renderOverviewBody(byId('view-overview')); });
  card.append(headerBtn);

  if (expanded) {
    const body = make('div', 'space-y-3 border-t border-line p-4');
    if (total === 0) body.append(emptyNote('今日尚無紀錄。'));
    else member.blocks.slice().sort((a, b) => blockSortMinutes(a) - blockSortMinutes(b)).forEach((b) => body.append(memberEntryLine(dateStr, b)));
    card.append(body);
  }
  return card;
}
function overviewTitleForOffset(offset) {
  if (offset === 0) return '今日工作日誌總覽';
  if (offset === 1) return '明日工作日誌總覽';
  return `${dateDisplayForOffset(offset)} 工作日誌總覽`;
}
function overviewHeadNode() {
  const head = make('div', 'mb-5');
  head.append(make('p', 'text-xs font-bold tracking-wide text-coraldark', '主管視角・唯讀'));
  head.append(make('h2', 'text-xl font-black text-ink sm:text-2xl', overviewTitleForOffset(OVERVIEW_DATE_OFFSET)));
  head.append(make('p', 'mt-1 text-sm text-inkmuted', `${overviewOffsetDateDisplay()}・依人員檢視，跨部門一起看，「已排定・尚未補紀錄」是排了但沒做的警示。`));
  return head;
}
function changeOverviewOffset(next) {
  OVERVIEW_DATE_OFFSET = Math.max(NAV_MIN_OFFSET, Math.min(NAV_MAX_OFFSET, next));
  refreshOverviewFromApi();
}
function groupByReporter(entries) {
  const map = new Map();
  entries.forEach((rec) => {
    // 2026-07-25 修復：V1 舊格式小時列不再整批過濾，parseApiEntry 會標記 isLegacy 唯讀顯示。
    if (!map.has(rec.reporter)) map.set(rec.reporter, { id: rec.reporter, label: rec.reporter, blocks: [] });
    map.get(rec.reporter).blocks.push(parseApiEntry(rec));
  });
  return [...map.values()];
}
async function loadAllFromApi(dateParam) {
  try {
    const qs = dateParam ? `&date=${encodeURIComponent(dateParam)}` : '';
    const res = await fetch(`${WORKER_BASE}/worklogListAll?token=${encodeURIComponent(API_TOKEN)}${qs}`);
    let json = null;
    try { json = await res.json(); } catch { json = null; }
    if (!res.ok || !json || json.ok !== true) return { ok: false, status: res.status };
    return { ok: true, json };
  } catch {
    return { ok: false, status: 0 };
  }
}
let overviewState = { status: 'idle', members: [], errorMsg: null };
let overviewReqId = 0;
function overviewEmptyText(offset) {
  if (offset === 0) return '今日尚無紀錄。';
  if (offset === 1) return '明天尚無排定紀錄。';
  return `${dateDisplayForOffset(offset)} 這天沒有紀錄。`;
}
function renderOverviewBody(root) {
  root.replaceChildren(overviewHeadNode(), dateNavRow(OVERVIEW_DATE_OFFSET, changeOverviewOffset));
  const dateStr = overviewOffsetDateStr();
  if (overviewState.status === 'loading') { root.append(emptyNote('載入中…')); return; }
  if (overviewState.status === 'error') { root.append(emptyNote(overviewState.errorMsg)); return; }
  if (overviewState.members.length === 0) { root.append(emptyNote(overviewEmptyText(OVERVIEW_DATE_OFFSET))); return; }
  const list = make('div', 'space-y-3');
  overviewState.members.forEach((member) => list.append(memberCard(dateStr, member)));
  root.append(list);
}
async function refreshOverviewFromApi() {
  const myReqId = ++overviewReqId;
  overviewState = { status: 'loading', members: [], errorMsg: null };
  renderOverviewBody(byId('view-overview'));
  const result = await loadAllFromApi(OVERVIEW_DATE_OFFSET !== 0 ? overviewOffsetDateStr() : null);
  if (myReqId !== overviewReqId) return;
  if (!result.ok) {
    const msg = result.status === 403
      ? '此連結沒有主管檢視權限，如有需要請聯繫管理者確認。'
      : result.status === 404
        ? '連結已失效，請聯繫窩的家管理者重新取得連結。'
        : '暫時無法連線到系統，請重新整理頁面再試一次。';
    overviewState = { status: 'error', members: [], errorMsg: msg };
  } else {
    overviewState = { status: 'ok', members: groupByReporter(result.json.entries || []), errorMsg: null };
  }
  renderOverviewBody(byId('view-overview'));
}
function renderOverviewView() {
  const root = byId('view-overview');
  if (!IDENTITY || IDENTITY.role !== 'manager') {
    root.replaceChildren(emptyNote('此頁僅主管角色可查看。'));
    return;
  }
  renderOverviewBody(root);
  if (overviewState.status !== 'loading') refreshOverviewFromApi();
}

// ================= 平台外殼：側欄／底部 tab／路由 =================
function icon(name) {
  const paths = {
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2" fill="none" stroke-linecap="round"/>',
    clipboard: '<rect x="6" y="4" width="12" height="16" rx="2" fill="none"/><path d="M9 4V3a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v1" fill="none"/><path d="M9 10h6M9 14h6M9 18h3" stroke-linecap="round"/>',
    link: '<path d="M8 12.5l4.2-4.2" stroke-linecap="round"/><path d="M9.5 15.5A4 4 0 0 1 8 9.4l2-2a4 4 0 0 1 5.6 5.6l-.9.9" fill="none"/><path d="M14.5 8.5A4 4 0 0 1 16 14.6l-2 2a4 4 0 0 1-5.6-5.6l.9-.9" fill="none"/>',
  };
  return `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">${paths[name] || ''}</svg>`;
}
const VALID_VIEWS = ['worklog', 'overview'];
const VIEW_TITLES = { worklog: '工作日誌', overview: '主管總覽' };
const NAV_ITEMS = [
  { id: 'worklog', label: '工作日誌', icon: 'clock' },
  { id: 'overview', label: '主管總覽', icon: 'clipboard', managerOnly: true },
];
const PLANNED_ITEMS = [
  { id: 'link', label: '案件正式關聯', icon: 'link', note: '工作日誌與工程案件的正式資料關聯規劃中，目前案名為文字＋自動建議，尚未串接。' },
];
function currentRole() { return IDENTITY ? IDENTITY.role : null; }
function currentView() {
  const h = (location.hash || '').replace('#', '');
  return VALID_VIEWS.includes(h) ? h : 'worklog';
}
function sidebarNavButton(item) {
  const active = currentView() === item.id;
  const locked = item.managerOnly && currentRole() !== 'manager';
  const cls = active ? 'bg-coral text-white' : locked ? 'text-white/30 hover:bg-white/10' : 'text-white/70 hover:bg-white/10 hover:text-white';
  const btn = make('button', `flex w-full items-center gap-2.5 rounded-xl px-3 py-2.5 text-sm font-bold transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white ${cls}`);
  btn.type = 'button';
  if (active) btn.setAttribute('aria-current', 'page');
  const ic = make('span', 'h-5 w-5 shrink-0');
  ic.innerHTML = icon(item.icon);
  btn.append(ic, make('span', 'flex-1 text-left', item.label + (locked ? '（主管專用）' : '')));
  btn.addEventListener('click', () => { if (locked) { showToast('此頁僅主管角色可查看'); return; } location.hash = item.id; });
  return btn;
}
function plannedButton(item) {
  const btn = make('button', 'flex w-full items-center gap-2.5 rounded-xl px-3 py-2.5 text-sm font-bold text-white/40 hover:bg-white/10 hover:text-white/70 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white');
  btn.type = 'button';
  const ic = make('span', 'h-5 w-5 shrink-0');
  ic.innerHTML = icon(item.icon);
  btn.append(ic, make('span', 'flex-1 text-left', `${item.label}（規劃中）`));
  btn.addEventListener('click', () => showToast(item.note));
  return btn;
}
function renderSidebarNav() {
  const nav = byId('sidebarNav');
  nav.replaceChildren();
  NAV_ITEMS.forEach((item) => nav.append(sidebarNavButton(item)));
  const planned = byId('sidebarPlanned');
  planned.replaceChildren();
  PLANNED_ITEMS.forEach((item) => planned.append(plannedButton(item)));
}
function renderBottomTabs() {
  const bar = byId('bottomTabBar');
  bar.replaceChildren();
  NAV_ITEMS.forEach((item) => {
    const active = currentView() === item.id;
    const locked = item.managerOnly && currentRole() !== 'manager';
    const cls = locked ? 'text-inkfaint/50' : active ? 'text-coral' : 'text-inkfaint';
    const btn = make('button', `flex flex-1 flex-col items-center gap-0.5 py-2 text-[11px] font-bold focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-ink ${cls}`);
    btn.type = 'button';
    if (active) btn.setAttribute('aria-current', 'page');
    const ic = make('span', 'h-5 w-5');
    ic.innerHTML = icon(item.icon);
    btn.append(ic, make('span', '', item.label));
    btn.addEventListener('click', () => { if (locked) { showToast('此頁僅主管角色可查看'); return; } location.hash = item.id; });
    bar.append(btn);
  });
}
function updateChromeLabels() {
  const deptKey = IDENTITY && deptKeyForCategoryGroup(IDENTITY.categoryGroup);
  const deptLabel = deptKey ? DEPARTMENTS[deptKey].label : (IDENTITY && IDENTITY.role === 'manager' ? '主管視角' : '窩的家');
  const nameLabel = IDENTITY ? (IDENTITY.role === 'manager' ? `${IDENTITY.name}（主管）` : IDENTITY.name) : '本機模擬';
  byId('sidebarSubtitle').textContent = `${deptLabel}・${nameLabel}`;
}

// 2026-07-24 事故修復同款：改網址 hash 一律保留 location.search，不弄丟 token。
function replaceHashKeepingQuery(hash) {
  history.replaceState(null, '', location.pathname + location.search + hash);
}

function applyRoute() {
  let view = currentView();
  if (view === 'overview' && currentRole() !== 'manager') {
    replaceHashKeepingQuery('#worklog');
    view = 'worklog';
    showToast('此頁僅主管角色可查看，已切回工作日誌');
  }
  VALID_VIEWS.forEach((v) => { byId('view-' + v).hidden = (v !== view); });
  byId('pageTitle').textContent = VIEW_TITLES[view];
  renderSidebarNav();
  renderBottomTabs();
  if (view === 'worklog') renderWorklogView();
  else renderOverviewView();
}
window.addEventListener('hashchange', applyRoute);

byId('resetButton').addEventListener('click', () => {
  if (!confirm('清空本機暫存的草稿快取，重新整理頁面？（不影響 Ragic 裡已經送出的紀錄）')) return;
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(RECENT_CAT_KEY);
  location.hash = 'worklog';
  location.reload();
});

// ================= 初始化 =================
(async function init() {
  const dl = byId('worklogCaseList');
  MOCK_CASES.forEach((c) => { const opt = document.createElement('option'); opt.value = c; dl.append(opt); });

  const initHash = (location.hash || '').replace('#', '');
  if (!VALID_VIEWS.includes(initHash)) replaceHashKeepingQuery('#worklog');

  // 無 token（連 localStorage 都沒有）一律整頁擋下，不提供「填得動、送出假成功」的模擬模式給
  // 正式使用者；開發除錯要用模擬模式，網址加 ?dev=1（比照 V1 worklog.html 既有防線）。
  // 2026-07-25 修掉既有小瑕疵：攔截畫面不再顯示任何「模式」標籤——之前不論是否被攔截都固定
  // 顯示「原型・本機模擬（無 token）」，跟「無法載入」訊息語意矛盾（明明整頁被擋，右上角卻說
  // 一切正常在模擬）。攔截時完全不顯示模式標籤；只有真的進入 dev=1 本機模擬或已連線 API 這兩種
  // 「頁面確實可運作」的狀態，才顯示對應標籤。
  if (!API_MODE && !new URLSearchParams(location.search).has('dev')) {
    renderFatalError('這個網址少了你的專屬通行碼，填寫的內容不會被儲存。請回到 LINE 找到管理者傳給你的完整連結，重新點開。');
    return;
  }

  const modeLabel = byId('modeLabel');
  if (modeLabel) modeLabel.textContent = API_MODE ? '已連線 API' : '開發模式・本機模擬（?dev=1）';

  if (API_MODE) {
    byId('view-worklog').replaceChildren(emptyNote('載入中…'));
    const mine = await loadMineFromApi();
    if (!mine.ok) {
      renderFatalError(mine.status === 404
        ? '此連結已失效或不存在，請聯繫窩的家管理者重新取得連結。'
        : '暫時無法連線到系統，請確認網路後重新整理頁面再試一次。');
      return;
    }
    IDENTITY = mine.json.viewer;
    applyMineData(mine.json, dateStrForOffset(0));
    LOADED_DATE_KEYS.add(0);
  }

  updateChromeLabels();
  applyRoute();
})();
</script>
