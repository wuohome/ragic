<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>窩的家｜做過的東西總覽</title>
<style>
:root{--ink:#1d2530;--main:#3F5262;--sub:#5c6775;--line:#dfe4ea;--bg:#f6f7f9;
--coral:#DD6650;--amber:#B39C00;--green:#5B8A5A;--card:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
-webkit-font-smoothing:antialiased}
header{background:var(--main);color:#fff;padding:22px 20px 18px}
h1{margin:0 0 4px;font-size:21px;letter-spacing:.5px}
.sub{font-size:13px;opacity:.85}
.stats{display:flex;gap:22px;margin-top:14px;flex-wrap:wrap}
.stat b{display:block;font-size:24px;line-height:1.1}
.stat span{font-size:12px;opacity:.85}
.wrap{max-width:1240px;margin:0 auto;padding:18px 20px 60px}
.bar{background:var(--card);border:1px solid var(--line);border-radius:12px;
padding:14px;margin-bottom:16px;position:sticky;top:8px;z-index:5;
box-shadow:0 1px 3px rgba(0,0,0,.04)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:9px}
.row:last-child{margin-bottom:0}
.lbl{font-size:12px;color:var(--sub);min-width:52px}
button.f{border:1px solid var(--line);background:#fff;color:var(--sub);
padding:5px 12px;border-radius:999px;font-size:13px;cursor:pointer;
font-family:inherit;transition:.12s}
button.f:hover{border-color:var(--main);color:var(--main)}
button.f.on{background:var(--main);border-color:var(--main);color:#fff}
input[type=search]{flex:1;min-width:180px;border:1px solid var(--line);
border-radius:8px;padding:7px 11px;font-size:14px;font-family:inherit}
input[type=search]:focus{outline:2px solid var(--main);outline-offset:-1px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;
padding:13px 15px;display:flex;flex-direction:column;gap:7px}
.card h3{margin:0;font-size:15.5px;font-weight:600;line-height:1.35}
.card h3 a{color:var(--main);text-decoration:none}
.card h3 a:hover{text-decoration:underline}
.card h3 .nolink{color:var(--ink)}
.p{font-size:13px;color:var(--sub);line-height:1.5;margin:0}
.tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{font-size:11.5px;padding:2px 8px;border-radius:999px;background:#eef1f4;color:var(--sub)}
.tag.s-on{background:#e8f2e8;color:#2f5030}
.tag.s-off{background:#fdece8;color:#8c3a28}
.tag.s-dead{background:#eceff2;color:#6b737b}
.tag.s-unk{background:#fdf6d0;color:#5c4b00}
.meta{font-size:11.5px;color:#8a929c;display:flex;gap:10px;flex-wrap:wrap;
border-top:1px dashed var(--line);padding-top:7px;margin-top:auto}
.count{font-size:12.5px;color:var(--sub);margin:0 0 10px}
.empty{padding:40px;text-align:center;color:var(--sub)}
.gh{grid-column:1/-1;font-size:13px;font-weight:700;color:var(--main);
padding:14px 2px 2px;border-bottom:2px solid var(--line)}
@media(max-width:640px){.grid{grid-template-columns:1fr}.bar{position:static}}
</style>
</head>
<body>
<header>
  <h1>做過的東西總覽</h1>
  <div class="sub">130 個系統、頁面、工具與腳本。含還沒上線的。點名稱可以直接開。</div>
  <div class="stats">
    <div class="stat"><b>130</b><span>全部</span></div>
    <div class="stat"><b>120</b><span>已上線</span></div>
    <div class="stat"><b>3</b><span>還沒上線</span></div>
    <div class="stat"><b>6</b><span>已停用或搬走</span></div>
  </div>
</header>
<div class="wrap">
  <div class="bar">
    <div class="row"><span class="lbl">搜尋</span>
      <input type="search" id="q" placeholder="打名稱、用途、網址都可以…">
    </div>
    <div class="row"><span class="lbl">狀態</span><span id="fs"></span></div>
    <div class="row"><span class="lbl">分類</span><span id="fc"></span></div>
    <div class="row"><span class="lbl">排序</span>
      <button class="f on" data-sort="date">新到舊</button>
      <button class="f" data-sort="cat">照分類分組</button>
      <button class="f" data-sort="name">照名稱</button>
    </div>
  </div>
  <p class="count" id="count"></p>
  <div class="grid" id="grid"></div>
</div>

const CATS = ["Bot與自動化", "人事", "內部工具", "工務報修", "已停用", "租賃業務", "系統文件", "行銷展示", "財務請款", "開發腳本"];
const STATUSES = ["已上線","還沒上線","已停用或搬走","狀態不明"];
let fCat="全部", fSta="全部", sortBy="date", q="";

function mk(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;
  if(txt!==undefined)e.textContent=txt;return e;}

function chips(host,list,cur,cb){
  host.innerHTML="";
  ["全部",...list].forEach(v=>{
    const b=mk("button","f"+(v===cur?" on":""),v);
    b.onclick=()=>cb(v); host.appendChild(b);
  });
}

function sCls(s){return s==="已上線"?"s-on":s==="還沒上線"?"s-off":
  s==="已停用或搬走"?"s-dead":"s-unk";}

function render(){
  let list=DATA.filter(d=>
    (fCat==="全部"||d.category===fCat)&&
    (fSta==="全部"||d._status===fSta)&&
    (!q||[d.name,d.purpose,d.url,d.audience,d.category,d.status]
      .join(" ").toLowerCase().includes(q)));

  if(sortBy==="name") list=[...list].sort((a,b)=>a.name.localeCompare(b.name,"zh-Hant"));
  else if(sortBy==="cat") list=[...list].sort((a,b)=>
    a.category.localeCompare(b.category,"zh-Hant")||(b._date||"").localeCompare(a._date||""));

  document.getElementById("count").textContent="顯示 "+list.length+" 筆";
  const g=document.getElementById("grid"); g.innerHTML="";
  if(!list.length){g.appendChild(mk("div","empty","沒有符合的項目"));return;}

  let lastCat=null;
  list.forEach(d=>{
    if(sortBy==="cat"&&d.category!==lastCat){
      lastCat=d.category; g.appendChild(mk("div","gh",d.category));
    }
    const c=mk("div","card");
    const h=mk("h3");
    if(d._link){const a=mk("a",null,d.name);a.href=d._link;a.target="_blank";
      a.rel="noopener";h.appendChild(a);}
    else{h.appendChild(mk("span","nolink",d.name));}
    c.appendChild(h);
    c.appendChild(mk("p","p",d.purpose||""));
    const t=mk("div","tags");
    t.appendChild(mk("span","tag "+sCls(d._status),d._status));
    t.appendChild(mk("span","tag",d.category));
    if(d.audience&&d.audience!=="UNKNOWN")t.appendChild(mk("span","tag",d.audience));
    c.appendChild(t);
    const m=mk("div","meta");
    m.appendChild(mk("span",null,d._date?d._date:"日期不詳"));
    if(d.status&&d.status!==d._status)m.appendChild(mk("span",null,d.status));
    if(!d._link)m.appendChild(mk("span",null,d._where||"內部服務，不對外"));
    c.appendChild(m);
    g.appendChild(c);
  });
}

function bindCat(){chips(document.getElementById("fc"),CATS,fCat,v=>{fCat=v;bindCat();render();});}
function bindSta(){chips(document.getElementById("fs"),STATUSES,fSta,v=>{fSta=v;bindSta();render();});}
bindCat();bindSta();
document.getElementById("q").addEventListener("input",e=>{q=e.target.value.trim().toLowerCase();render();});
document.querySelectorAll("[data-sort]").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("[data-sort]").forEach(x=>x.classList.remove("on"));
  b.classList.add("on"); sortBy=b.dataset.sort; render();});
render();
</script>
