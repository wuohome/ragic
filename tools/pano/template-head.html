<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,noimageindex">
<meta name="referrer" content="no-referrer">
<title>{{TITLE}} · 360 環景</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0e0f11;
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;color:#fff}
#stage{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
canvas.dragging{cursor:grabbing}

.top{position:fixed;top:0;left:0;right:0;padding:18px 22px 46px;z-index:5;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,.62),rgba(0,0,0,0))}
.top h1{font-size:15px;font-weight:600;letter-spacing:.06em;opacity:.92}
.top .now{margin-top:5px;font-size:26px;font-weight:700;letter-spacing:.02em;
  text-shadow:0 2px 14px rgba(0,0,0,.6)}
.top .desc{margin-top:3px;font-size:13px;opacity:.62}

.hint{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:6;
  padding:13px 26px;border-radius:999px;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.16);font-size:14px;letter-spacing:.05em;
  transition:opacity .6s;pointer-events:none}
.hint.gone{opacity:0}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:52px 14px 14px;
  background:linear-gradient(0deg,rgba(0,0,0,.78),rgba(0,0,0,0));
  overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.bar::-webkit-scrollbar{height:5px}
.bar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.25);border-radius:9px}
.strip{display:flex;gap:10px;min-width:min-content;padding-bottom:2px}
.thumb{flex:0 0 auto;width:118px;border:2px solid transparent;border-radius:9px;
  overflow:hidden;cursor:pointer;background:#1a1c1f;transition:border-color .18s,transform .18s;position:relative}
.thumb:hover{transform:translateY(-2px)}
.thumb img{display:block;width:100%;height:59px;object-fit:cover;opacity:.72;transition:opacity .18s}
.thumb:hover img{opacity:1}
.thumb span{display:block;padding:5px 7px 6px;font-size:11.5px;line-height:1.3;
  text-align:center;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thumb.on{border-color:#f0b429;transform:translateY(-2px)}
.thumb.on img{opacity:1}
.thumb.on span{opacity:1;font-weight:600;color:#f0b429}
.thumb i{position:absolute;top:4px;left:5px;font-style:normal;font-size:10px;font-weight:700;
  padding:1px 5px;border-radius:4px;background:rgba(0,0,0,.62);opacity:.8}

.nav{position:fixed;top:50%;transform:translateY(-50%);z-index:6;width:44px;height:64px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  background:rgba(0,0,0,.34);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(6px);
  font-size:22px;opacity:.55;transition:opacity .18s,background .18s;user-select:none}
.nav:hover{opacity:1;background:rgba(0,0,0,.55)}
#prev{left:0;border-radius:0 10px 10px 0;border-left:none}
#next{right:0;border-radius:10px 0 0 10px;border-right:none}

.tools{position:fixed;top:16px;right:16px;z-index:6;display:flex;gap:8px}
.tools button{width:40px;height:40px;border-radius:10px;border:1px solid rgba(255,255,255,.16);
  background:rgba(0,0,0,.42);backdrop-filter:blur(6px);color:#fff;font-size:16px;cursor:pointer;
  transition:background .18s}
.tools button:hover{background:rgba(0,0,0,.68)}
.tools button.on{background:#f0b429;color:#141414;border-color:#f0b429}

@media(max-width:640px){
  .top{padding:14px 16px 40px}
  .top .now{font-size:20px}
  .top h1{font-size:13px}
  .thumb{width:98px}
  .thumb img{height:49px}
  .nav{width:36px;height:56px;font-size:18px}
}
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas></div>

<div class="top">
  <h1>{{TITLE}} · 360 度環景</h1>
  <div class="now" id="ttl"></div>
  <div class="desc" id="dsc"></div>
</div>

<div class="hint" id="hint">按住畫面拖曳，可以看向四周</div>

<div class="nav" id="prev">‹</div>
<div class="nav" id="next">›</div>

<div class="tools">
  <button id="btnAuto" title="自動旋轉">↻</button>
  <button id="btnFull" title="全螢幕">⛶</button>
</div>

<div class="bar"><div class="strip" id="strip"></div></div>

<script>
var SCENES = [
