<script>
  /* ===================================================================================
     2026-07-25 回退重建：Joan 原話「上一個版本設計比較好，我說怪是配色怪，不是設計怪」。
     結構退回第一輪（深色側欄 app shell／彩色時間軸橫條／四個語意色狀態），只重做配色。
     第一輪的檔案沒備份、git 也沒紀錄，這次依 main 提供的規格描述＋本檔仍保留的判定邏輯
     （computeTimelineWindow／buildTimelineSegments，一行沒動）重建。

     配色改法：語意色全部改成 CSS variable（--c-*），tailwind.config 的顏色 token 指到
     var()，切換配色只是換 [data-palette] 選到的變數值，不用重新整理頁面、也不用改任何
     class。三組配色的設計理路見下方 PALETTES 區塊註解與檔案內建「配色 A/B/C」demo 鈕。
     =================================================================================== */
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          // 中性色（側欄／底色／邊框）：三組配色共用，Joan 沒說這組「怪」，維持不動。
          ink: '#1F3A44',
          inkdeep: '#12262E',
          inkmuted: '#4B6570',
          inkfaint: '#7C9298',
          paper: '#F0F8FA',
          line: '#C3D6DB',
          // 語意色：全部指到 CSS variable，由 [data-palette] 決定實際色碼。
          coral: 'var(--c-primary)',
          coraldark: 'var(--c-primary-dark)',
          coraltint: 'var(--c-primary-tint)',
          submitted: 'var(--c-submitted)',
          pending: 'var(--c-pending)',
          pendingtint: 'var(--c-pending-tint)',
          pendingdark: 'var(--c-pending-dark)',
          overlap: 'var(--c-overlap)',
          overlapdark: 'var(--c-overlap-dark)',
          overlaptint: 'var(--c-overlap-tint)',
        },
      },
    },
  };
</script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Segoe UI", sans-serif; }

  /* =====================================================================
     三組配色（2026-07-25）。四個狀態統一用同一套「結構語言」跨三組配色不變：
       已送出＝實心色塊（bg-submitted, 白字＋✓）
       尚未送出＝外框色塊（border-pending＋bg-pendingtint＋text-pendingdark）
       時間重疊＝警示色塊（border-overlap＋bg-overlaptint＋text-overlapdark，⚠ 文字）
       空檔＝斜紋（--c-gap-a／--c-gap-b 兩色交錯）
     只換色碼，不換結構——避免切配色時版面跳動，也避免重蹈「把設計跟著配色一起改掉」。

     A｜單色階為主：主色/已送出同一個藍綊色相、只靠明度與實心／外框分濃淡，
        整個系統只留「重疊」一個真正跳出來的警示色（紅）。最安靜、最不會互相打架。
     B｜冷色主調＋一個暖色警示：藍（互動／尚未送出外框）＋綠（已送出）兩個冷色相隔
        夠遠不會混淆，重疊用唯一的暖色（橘紅）當警報，冷暖對比做第一層辨識。
     C｜工地強光高對比：四個狀態各自一個飽和、偏深的獨立色相（藍／綠／芥黃／紅），
        避開淡色調（淡色在戶外強光下會被曬到看不見），刻意壓深，讓對比撐住。
     ===================================================================== */
  [data-palette="a"] {
    --c-primary: #007894; --c-primary-dark: #00657D; --c-primary-tint: #EAF7F9;
    --c-submitted: #0B4F5E;
    --c-pending: #007894; --c-pending-dark: #00657D; --c-pending-tint: #EAF7F9;
    --c-overlap: #B3261E; --c-overlap-dark: #7A1D15; --c-overlap-tint: #FBEAEA;
    --c-gap-a: #EAF7F9; --c-gap-b: #D8EDF1; --c-gap-a-hover: #CFEBEF; --c-gap-b-hover: #B7DEE4;
  }
  [data-palette="b"] {
    --c-primary: #1E63A8; --c-primary-dark: #154A80; --c-primary-tint: #E8F1FA;
    --c-submitted: #157F3C;
    --c-pending: #1E63A8; --c-pending-dark: #154A80; --c-pending-tint: #E8F1FA;
    --c-overlap: #C2410C; --c-overlap-dark: #7C2A08; --c-overlap-tint: #FBEAE1;
    --c-gap-a: #E8F1FA; --c-gap-b: #D4E4F2; --c-gap-a-hover: #CFE3F5; --c-gap-b-hover: #B7D3EC;
  }
  [data-palette="c"] {
    --c-primary: #004C8C; --c-primary-dark: #003864; --c-primary-tint: #E1EEF8;
    --c-submitted: #146C2E;
    --c-pending: #8A5A00; --c-pending-dark: #634100; --c-pending-tint: #FBF0DC;
    --c-overlap: #C81E1E; --c-overlap-dark: #8F1414; --c-overlap-tint: #FBE3E3;
    --c-gap-a: #E1EEF8; --c-gap-b: #C3DCF0; --c-gap-a-hover: #CFE3F5; --c-gap-b-hover: #A9CDE9;
  }

  /* 「好填寫」語彙沿用 from.html／V1：大字、粗框、明顯焦點狀態，不用細緻小巧的輸入框 */
  select, textarea, input:not([type="checkbox"]) {
    min-height: 52px;
    font-size: 17px !important;
    padding: 12px 14px !important;
    border-width: 2px !important;
    border-radius: 12px !important;
    background-color: #FFFFFF !important;
    border-color: #B9CBD1 !important;
  }
  select:focus, textarea:focus, input:not([type="checkbox"]):focus {
    border-color: var(--c-primary) !important;
    outline: none;
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--c-primary) 18%, transparent);
  }
  input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--c-primary); }
  .tnum { font-variant-numeric: tabular-nums; }
  .tap44 { min-height: 44px; }
  #toast { transition: opacity 200ms ease-out; }
  .accordion { transition: grid-template-rows 200ms cubic-bezier(0.23, 1, 0.32, 1); }
  .accordion-inner { overflow: hidden; }

  /* ===== 彩色時間軸橫條（第一輪設計，2026-07-25 restore）=====
     判定邏輯（哪段是 gap／哪段是 block）完全沿用 computeTimelineWindow()／
     buildTimelineSegments()，這裡只負責視覺呈現，一行都沒碰那兩個 function。 */
  .timeline-track { display: flex; width: 100%; height: 38px; border-radius: 10px; overflow: hidden; border: 2px solid #C3D6DB; background: #fff; transition: background-color 200ms ease-out, border-color 200ms ease-out; }
  .timeline-seg { position: relative; height: 100%; min-width: 3px; transition: background-color 200ms ease-out, box-shadow 200ms ease-out; }
  .timeline-seg-gap { background-image: repeating-linear-gradient(135deg, var(--c-gap-a) 0 7px, var(--c-gap-b) 7px 14px); cursor: pointer; border: none; padding: 0; }
  .timeline-seg-gap:hover, .timeline-seg-gap:focus-visible { background-image: repeating-linear-gradient(135deg, var(--c-gap-a-hover) 0 7px, var(--c-gap-b-hover) 7px 14px); }
  .timeline-seg-block { cursor: pointer; border: none; padding: 0; }
  .timeline-seg-submitted { background: var(--c-submitted); }
  .timeline-seg-pending { background: var(--c-pending-tint); box-shadow: inset 0 0 0 2px var(--c-pending); }
  .timeline-seg-overlap { background: var(--c-overlap); }
  .timeline-now-marker { position: absolute; top: -5px; bottom: -5px; width: 2px; background: #1F3A44; z-index: 5; pointer-events: none; }
  .timeline-now-dot { position: absolute; top: -12px; height: 6px; width: 6px; border-radius: 999px; background: #1F3A44; transform: translateX(-2px); pointer-events: none; }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0.001ms !important; animation-duration: 0.001ms !important; }
  }
</style>
</head>

<script>
'use strict';

/* =====================================================================================
   工作日誌 V2（2026-07-24 Joan 拍板重做）── 純本機原型，mock 資料，不連任何 API，不影響
   C:\Users\Joan\Projects\ragic\worklog.html（V1 正式版，兩位使用者天天在用，完全不動）。

   核心變更（相對 V1）：
   1. 每筆紀錄改成自訂起訖時間（15 分鐘刻度），取代 11 個固定小時格；不再有「0900之前／
      19:00之後」桶籃選項，中午也不再是缺口，想幾點記就幾點記。
   2. 「項目」選單依部門真正分流（各部門各自獨立清單，不是聯集＋排序）；部門清單集中定義在
      DEPARTMENTS，未來加第三、第四個部門只需要在這裡新增一個物件，其餘程式碼不用改。
   3. 兩段式流程重新設計：「今日計畫」是輕量、不需要時間的意圖清單；「實際紀錄」才是掛在時間軸
      上、有起訖時間的真正紀錄。計畫可以一鍵「轉為實際紀錄」，帶過項目/案名，只需要補時間。
   4. 送出機制改成「逐筆立即儲存」（點「儲存這筆」馬上模擬送出），取代 V1「填一整天、最後一次
      全部送出」的模式——這是直接針對 2026-07-24 資料遺失事故的設計回應：每一筆的成功/失敗都
      立即可見，不會累積一整天的假象直到最後才發現全部沒送出。詳見下方 saveBlock()。
   ===================================================================================== */

// ================= 部門設定（真正分流：每個部門各自完整清單，不是共用清單排序） =================
// 未來加新部門：在這裡新增一個 key，加進 DEPARTMENT_ORDER，其餘程式碼（選單渲染、驗證、
// 主管總覽分組）都是讀這份設定，不需要逐一修改。
const DEPARTMENTS = {
  construction: {
    key: 'construction',
    label: '工務部',
    categories: ['場勘', '租客聯繫', '屋主聯繫', '報價', '廠商聯繫', '驗收', '內部會議', '文書作業', '其他'],
    repairRelated: new Set(['驗收', '廠商聯繫']),
  },
  rental: {
    key: 'rental',
    label: '租賃部',
    categories: ['開發', '委託', '帶看', '簽約', '修繕', '續約', '議價', '請假', '休假', '上課', '活動', '上廣告', '退租點交'],
    repairRelated: new Set(['修繕']),
  },
};
const DEPARTMENT_ORDER = ['construction', 'rental'];
const OTHER_CATEGORY = '其他';

function categoriesForIdentity(identity) {
  if (identity.deptKey && DEPARTMENTS[identity.deptKey]) return DEPARTMENTS[identity.deptKey].categories;
  // 主管沒有自己的部門清單：給「所有部門聯集」而非鎖死工務優先，因為主管可能也要記自己的時間，
  // 且未來部門一多，鎖死某一個部門對主管不公平。聯集去重，依 DEPARTMENT_ORDER 排列。
  const seen = new Set();
  const out = [];
  DEPARTMENT_ORDER.forEach((k) => DEPARTMENTS[k].categories.forEach((c) => { if (!seen.has(c)) { seen.add(c); out.push(c); } }));
  return out;
}
function repairRelatedForIdentity(identity) {
  if (identity.deptKey && DEPARTMENTS[identity.deptKey]) return DEPARTMENTS[identity.deptKey].repairRelated;
  const merged = new Set();
  DEPARTMENT_ORDER.forEach((k) => DEPARTMENTS[k].repairRelated.forEach((c) => merged.add(c)));
  return merged;
}

const MOCK_CASES = [
  '王公館・台中市南屯區文心路三段',
  '陳宅・彰化縣員林市中山路',
  '日安大樓 3F・台中市西區精誠路',
  '康橋苑 12F・台中市北屯區崇德路',
  '松林社區 B棟・彰化縣和美鎮彰南路',
  '幸福巷弄自宅・台中市大里區國光路',
];

// 身分切換（原型示範用）。正式版由連結 token 決定角色／部門，使用者不會看到切換按鈕，
// 也不能自己選——這裡三顆按鈕純粹是給 Joan 一次看完三種身分的差異用。
const MOCK_IDENTITIES = [
  { key: 'construction', role: 'staff', deptKey: 'construction', label: '工務（陳勁豪・示範）' },
  { key: 'rental', role: 'staff', deptKey: 'rental', label: '租賃（葉恩廷・示範）' },
  { key: 'manager', role: 'manager', deptKey: null, label: '主管（小吳哥・示範）' },
];

// 配色挑選 demo（原型限定）。實際色碼定義在 <style> 的 [data-palette="x"]，這裡只負責
// 切換 <body data-palette> 與按鈕文案／說明，純 CSS variable 換色，不重新整理頁面。
const PALETTES = [
  { key: 'a', label: 'A・單色階', note: '主色與已送出同一色相，只靠明度/實心外框分濃淡，只有「重疊」一個警示色跳出來。' },
  { key: 'b', label: 'B・冷＋暖警示', note: '藍（互動/尚未送出）＋綠（已送出）兩個冷色相隔夠遠，重疊用唯一暖色（橘紅）當警報。' },
  { key: 'c', label: 'C・強光高對比（推薦）', note: '四狀態各自獨立深色相，避開淡色調——工地強光下手機螢幕也能一眼辨識。' },
];
const PALETTE_KEY = 'wuohome_worklog_v2_palette';
let CURRENT_PALETTE = localStorage.getItem(PALETTE_KEY) || 'c';
function setPalette(key) {
  CURRENT_PALETTE = key;
  localStorage.setItem(PALETTE_KEY, key);
  document.body.dataset.palette = key;
}

// ================= 基礎工具 =================
const byId = (id) => document.getElementById(id);
function make(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}
const pad = (n) => String(n).padStart(2, '0');
function uid() { return 'x' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4); }

// ================= 時間工具（15 分鐘刻度） =================
const STEP_MINUTES = 15;
function timeToMinutes(t) { if (!t) return null; const [h, m] = t.split(':').map(Number); return h * 60 + m; }
function minutesToTime(mins) { mins = ((Math.round(mins) % 1440) + 1440) % 1440; return `${pad(Math.floor(mins / 60))}:${pad(mins % 60)}`; }
function roundToStep(mins, step) { step = step || STEP_MINUTES; return Math.round(mins / step) * step; }
function floorHour(mins) { return Math.floor(mins / 60) * 60; }
function ceilHour(mins) { return Math.ceil(mins / 60) * 60; }
function nowMinutes() { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); }
function formatDuration(mins) {
  const h = Math.floor(mins / 60), m = mins % 60;
  if (h === 0) return `${m} 分鐘`;
  if (m === 0) return `${h} 小時`;
  return `${h} 小時 ${m} 分`;
}

  d.setDate(d.getDate() + offsetDays);
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}
function dateDisplayForOffset(offsetDays) {
  const d = new Date();
  d.setDate(d.getDate() + offsetDays);
  const wd = ['日', '一', '二', '三', '四', '五', '六'][d.getDay()];
  return `${d.getMonth() + 1}/${d.getDate()}（${wd}）`;
}

}

}
function isBlockFilled(b) { return !!(b && b.category); }
function blocksList(day) { return Object.values(day.blocks); }
function plansList(day) { return Object.values(day.plans); }
function sortedBlocks(day) {
  return blocksList(day).slice().sort((a, b) => (timeToMinutes(a.start) ?? 0) - (timeToMinutes(b.start) ?? 0));
}

// ================= 建議的預設起訖時間（降低摩擦：接續上一筆結束時間） =================
function suggestedStartTime(day) {
  const filled = blocksList(day).filter((b) => b.start && b.end);
  if (filled.length) {
    const maxEnd = Math.max(...filled.map((b) => timeToMinutes(b.end)));
    return minutesToTime(Math.min(maxEnd, 23 * 60 + 45));
  }
  if (SELECTED_DATE === 'today') return minutesToTime(Math.min(roundToStep(nowMinutes()), 23 * 60 + 45));
  return '09:00';
}
function suggestedEndTime(startTime) {
  const s = timeToMinutes(startTime);
  return minutesToTime(Math.min(s + 60, 23 * 60 + 45));
}

// ================= 重疊偵測（軟提醒，不阻擋送出——理由見設計說明／回報） =================
function findOverlaps(day, blockId, start, end) {
  const s = timeToMinutes(start), e = timeToMinutes(end);
  if (s == null || e == null || e <= s) return [];
  return blocksList(day)
    .filter((b) => b.id !== blockId && b.start && b.end)
    .map((b) => {
      const bs = timeToMinutes(b.start), be = timeToMinutes(b.end);
      const os = Math.max(s, bs), oe = Math.min(e, be);
      return oe > os ? { block: b, minutes: oe - os } : null;
    })
    .filter(Boolean);
}
function blockHasOverlap(day, block) {
  if (!block.start || !block.end) return false;
  return findOverlaps(day, block.id, block.start, block.end).length > 0;
}

// ================= 時間軸視覺化 =================
function computeTimelineWindow(blocks) {
  const filled = blocks.filter((b) => b.start && b.end);
  const starts = filled.map((b) => timeToMinutes(b.start));
  const ends = filled.map((b) => timeToMinutes(b.end));
  const minS = starts.length ? Math.min(...starts, 7 * 60) : 7 * 60;
  const maxE = ends.length ? Math.max(...ends, 20 * 60) : 20 * 60;
  return { start: floorHour(minS), end: ceilHour(maxE) };
}
function buildTimelineSegments(blocks, win) {
  const sorted = blocks.filter((b) => b.start && b.end).slice().sort((a, b) => timeToMinutes(a.start) - timeToMinutes(b.start));
  const segs = [];
  let cursor = win.start;
  sorted.forEach((b) => {
    const s = Math.max(timeToMinutes(b.start), win.start, cursor);
    const e = Math.min(timeToMinutes(b.end), win.end);
    if (e <= s) return; // 完全被前一筆重疊蓋住的時段，列表裡仍看得到、時間軸簡化不重複畫
    if (s > cursor) segs.push({ type: 'gap', start: cursor, end: s });
    segs.push({ type: 'block', start: s, end: e, block: b, clipped: timeToMinutes(b.start) < cursor });
    cursor = Math.max(cursor, e);
  });
  if (cursor < win.end) segs.push({ type: 'gap', start: cursor, end: win.end });
  return segs;
}
// ================= 彩色時間軸橫條（第一輪設計，2026-07-25 restore） =================
// 判定邏輯完全沿用上面的 computeTimelineWindow()／buildTimelineSegments()，一行沒改。
// 這裡只負責把同一份 segments 資料畫成橫條：色塊分四種狀態（已送出=實心／尚未送出=外框／
// 時間重疊=警示／空檔=斜紋），點色塊跳到清單對應那列並展開，點空檔直接帶時間新增一筆。
function timelineLegendDot(cls, style) {
  const dot = make('span', `inline-block h-3 w-3 shrink-0 rounded-[3px] ${cls}`);
  if (style) Object.assign(dot.style, style);
  return dot;
}
function renderTimelineLegend() {
  const wrap = make('div', 'mt-2 flex flex-wrap gap-x-4 gap-y-1.5');
  const items = [
    { dot: timelineLegendDot('bg-submitted'), label: '已送出' },

    { dot: timelineLegendDot('bg-overlap'), label: '時間重疊' },
    { dot: timelineLegendDot('', { backgroundImage: 'repeating-linear-gradient(135deg, var(--c-gap-a) 0 4px, var(--c-gap-b) 4px 8px)' }), label: '空檔（可點擊新增）' },
  ];
  items.forEach((it) => {
    const row = make('span', 'inline-flex items-center gap-1.5 text-[11px] font-bold text-inkmuted');
    row.append(it.dot, make('span', '', it.label));
    wrap.append(row);
  });

}
function renderTimelineBar(dateStr, day, blocks) {
  const win = computeTimelineWindow(blocks);
  const segs = buildTimelineSegments(blocks, win);
  const totalMin = Math.max(win.end - win.start, 1);

  const wrap = make('div', 'mb-4');
  const track = make('div', 'timeline-track');

  segs.forEach((seg) => {
    const dur = Math.max(seg.end - seg.start, 1);
    if (seg.type === 'gap') {
      const btn = make('button', 'timeline-seg timeline-seg-gap focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-ink');
      btn.type = 'button';
      btn.style.flex = `${dur} 0 0%`;
      btn.setAttribute('aria-label', `${minutesToTime(seg.start)}–${minutesToTime(seg.end)} 沒有紀錄，點擊新增`);
      btn.addEventListener('click', () => addBlock(dateStr, { start: minutesToTime(seg.start), end: minutesToTime(seg.end) }));
      track.append(btn);
    } else {
      const hasOverlap = blockHasOverlap(day, seg.block);
      const stateCls = hasOverlap ? 'timeline-seg-overlap' : (seg.block.synced ? 'timeline-seg-submitted' : 'timeline-seg-pending');
      const catLabel = seg.block.category === OTHER_CATEGORY ? (seg.block.otherCategoryText || '其他') : (seg.block.category || '未填項目');
      const btn = make('button', `timeline-seg timeline-seg-block ${stateCls} focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-ink`);
      btn.type = 'button';
      btn.style.flex = `${dur} 0 0%`;
      btn.setAttribute('aria-label', `${seg.block.start}–${seg.block.end} ${catLabel}${hasOverlap ? '（時間重疊）' : seg.block.synced ? '（已送出）' : '（尚未送出）'}`);
      btn.addEventListener('click', () => {
        EXPANDED_BLOCKS.add(seg.block.id);
        renderWorklogView();
        requestAnimationFrame(() => {
          const el = byId(`row-block-${seg.block.id}`);
          if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        });
      });
      track.append(btn);
    }
  });

  // 「現在」時間標記：只在今天、且現在時間落在時間軸窗口內才畫
  if (SELECTED_DATE === 'today') {
    const now = nowMinutes();
    if (now >= win.start && now <= win.end) {
      const pct = ((now - win.start) / totalMin) * 100;
      const marker = make('div', 'timeline-now-marker');
      marker.style.left = `${pct}%`;
      const dot = make('div', 'timeline-now-dot');
      dot.style.left = `${pct}%`;
      const markerWrap = make('div', 'relative');
      markerWrap.append(track, marker, dot);
      wrap.append(markerWrap);
      wrap.append(renderTimelineLegend());
      return wrap;
    }
  }
  wrap.append(track);
  wrap.append(renderTimelineLegend());
  return wrap;
}

// ================= 實際紀錄區塊：新增／編輯／儲存 =================
function saveBlock(dateStr, blockId, btn) {
  const day = getDayState(dateStr);
  const block = day.blocks[blockId];
  if (!block) return;
  if (!block.category) { showToast('請先選擇項目再儲存'); return; }
  const s = timeToMinutes(block.start), e = timeToMinutes(block.end);
  if (s == null || e == null) { showToast('請填寫開始與結束時間'); return; }
  if (e <= s) { showToast('結束時間必須晚於開始時間'); return; }

  btn.disabled = true;
  btn.textContent = '儲存中…';
  block.saveError = null;
  mockSubmitBlock().then((res) => {
    if (res.ok) {
      block.synced = true;
      block.saveError = null;
      setDayState(dateStr, day);
      EXPANDED_BLOCKS.delete(blockId); // 成功後收合，回到列表一眼看到「已送出」徽章
      renderWorklogView();
    } else {
      block.synced = false;
      block.saveError = res.error;
      setDayState(dateStr, day);
      renderWorklogView();
    }
  });
}
function deleteBlock(dateStr, blockId) {
  const day = getDayState(dateStr);
  delete day.blocks[blockId];
  setDayState(dateStr, day);
  EXPANDED_BLOCKS.delete(blockId);
  renderWorklogView();
}
function addBlock(dateStr, prefill) {
  const day = getDayState(dateStr);
  const b = blankBlock();
  const start = (prefill && prefill.start) || suggestedStartTime(day);
  Object.assign(b, { start, end: (prefill && prefill.end) || suggestedEndTime(start) }, prefill && prefill.fields ? prefill.fields : {});
  day.blocks[b.id] = b;
  setDayState(dateStr, day);
  EXPANDED_BLOCKS.add(b.id);
  renderWorklogView();
  requestAnimationFrame(() => {
    const el = byId(`row-block-${b.id}`);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  });
  return b.id;
}
function addFullDayBlock(dateStr) {
  addBlock(dateStr, { start: '09:00', end: '18:00' });
  showToast('已建立整天區塊（09:00–18:00），可依實際情況調整起訖時間');
}

    line.append(block.synced
      ? make('span', 'inline-flex shrink-0 items-center gap-0.5 rounded-full bg-submitted px-2 py-0.5 text-xs font-bold text-white', '✓ 已送出')
      : make('span', 'inline-block shrink-0 rounded-full border-2 border-pending bg-pendingtint px-2 py-0.5 text-xs font-bold text-pendingdark', '尚未送出'));
    if (hasOverlap) {
      const overlaps = findOverlaps(day, block.id, block.start, block.end);
      const otherLabel = overlaps.length === 1
        ? (overlaps[0].block.category === OTHER_CATEGORY ? (overlaps[0].block.otherCategoryText || '其他') : overlaps[0].block.category)
        : `${overlaps.length} 筆`;
      line.append(make('span', 'inline-block shrink-0 rounded-full border-2 border-overlap bg-overlaptint px-2 py-0.5 text-xs font-bold text-overlapdark', `⚠ 與 ${otherLabel} 重疊`));
    }
    if (block.caseName) line.append(make('span', 'truncate text-sm font-bold text-ink', block.caseName));
    previewCol.append(line);
    if (block.repairReason) previewCol.append(make('p', 'mt-0.5 truncate text-xs text-inkmuted', `報修原因：${block.repairReason}`));
  } else {
    previewCol.append(make('p', 'text-sm text-inkmuted', '尚未填寫項目'));
  }
  headerBtn.append(previewCol);
  headerBtn.append(expandHintPill(expanded, filled));
  headerBtn.addEventListener('click', () => { if (EXPANDED_BLOCKS.has(block.id)) EXPANDED_BLOCKS.delete(block.id); else EXPANDED_BLOCKS.add(block.id); renderWorklogView(); });
  wrap.append(headerBtn);

  if (!expanded) return wrap;

  const form = make('div', 'space-y-3 border-t border-line px-3 pb-3 pt-3');

  // 起訖時間：原生 <input type="time">，15 分鐘刻度。手機上會叫出系統原生時間選擇器，
  // 體驗已經很成熟（比自製滾輪穩定、不用額外處理鍵盤/無障礙），見回報中的取捨說明。
  const timeRow = make('div', 'grid grid-cols-2 gap-2');
  const startWrap = make('div');
  startWrap.append(fieldLabel('開始時間'));
  const startInput = make('input', 'mt-1 block w-full rounded-lg border border-line px-2 text-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ink');
  startInput.type = 'time';
  startInput.step = 900;
  startInput.value = block.start || '';
  startWrap.append(startInput);
  const endWrap = make('div');
  endWrap.append(fieldLabel('結束時間'));
  const endInput = make('input', 'mt-1 block w-full rounded-lg border border-line px-2 text-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ink');
  endInput.type = 'time';
  endInput.step = 900;
  endInput.value = block.end || '';
  endWrap.append(endInput);
  timeRow.append(startWrap, endWrap);
  form.append(timeRow);

  function commitTime(field, val) {
    const d = getDayState(dateStr);
    const b = d.blocks[block.id];
    if (!b) return;
    // 防禦：不論瀏覽器的原生時間選擇器介面是否真的每格都卡在 15 分鐘，送出前都強制吸附一次，
    // 避免不同瀏覽器（尤其 iOS Safari）用滾輪選出奇怪的分鐘數。
    b[field] = val ? minutesToTime(roundToStep(timeToMinutes(val))) : '';
    setDayState(dateStr, d);
  }
  startInput.addEventListener('change', () => { commitTime('start', startInput.value); renderWorklogView(); });
  endInput.addEventListener('change', () => { commitTime('end', endInput.value); renderWorklogView(); });

  form.append(timeAdjustRow(
    () => getDayState(dateStr).blocks[block.id].end || block.start,
    (val) => commitTime('end', val),
    renderWorklogView,
  ));

  const overlapBox = overlapWarningBox(getDayState(dateStr), getDayState(dateStr).blocks[block.id]);
  if (overlapBox) form.append(overlapBox);

  // 項目
  form.append(fieldLabel('項目'));
  form.append(categoryGrid(block, (name) => {
    const d = getDayState(dateStr);
    const b = d.blocks[block.id];
    b.category = name;
    if (name !== OTHER_CATEGORY) b.otherCategoryText = '';
    setDayState(dateStr, d);
    pushRecentCat(name);
    renderWorklogView();
  }));

  // 其他（請註明）
  const otherWrap = make('div', 'accordion grid');
  otherWrap.style.gridTemplateRows = block.category === OTHER_CATEGORY ? '1fr' : '0fr';
  const otherInner = make('div', 'accordion-inner');
  const otherLabelEl = make('label', 'block pt-2 text-xs font-bold text-inkmuted', '其他項目名稱（請簡短說明）');
  const otherInput = make('input', 'mt-1 block w-full rounded-lg border border-line px-2 text-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ink');
  otherInput.type = 'text';
  otherInput.placeholder = '例如：搬運材料、等待廠商';
  otherInput.value = block.otherCategoryText || '';
  otherInput.addEventListener('input', () => { const d = getDayState(dateStr); d.blocks[block.id].otherCategoryText = otherInput.value; setDayState(dateStr, d); });
  otherLabelEl.append(otherInput);
  otherInner.append(otherLabelEl);
  otherWrap.append(otherInner);
  form.append(otherWrap);

  // 案名/地址
  const caseLabelEl = fieldLabel('案名/地址（選填）');
  const caseInput = make('input', 'mt-1 block w-full rounded-lg border border-line px-2 text-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ink');
  caseInput.type = 'text';
  caseInput.placeholder = '輸入或從既有案件挑選，沒有可留空';
  caseInput.setAttribute('list', 'worklogCaseList');
  caseInput.value = block.caseName || '';
  caseInput.addEventListener('input', () => { const d = getDayState(dateStr); d.blocks[block.id].caseName = caseInput.value; setDayState(dateStr, d); });
  caseLabelEl.append(caseInput);
  form.append(caseLabelEl);

  // 報修原因（條件顯示：僅修繕相關項目）
  const repairSet = repairRelatedForIdentity(CURRENT_IDENTITY);
  const repairWrap = make('div', 'accordion grid');
  repairWrap.style.gridTemplateRows = repairSet.has(block.category) ? '1fr' : '0fr';
  const repairInner = make('div', 'accordion-inner');
  const repairLabelEl = make('label', 'block pt-3 text-xs font-bold text-inkmuted', '報修原因（選填）');
  const repairInput = make('input', 'mt-1 block w-full rounded-lg border border-line px-2 text-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ink');
  repairInput.type = 'text';
  repairInput.placeholder = '例如：浴室天花板漏水複驗';
  repairInput.value = block.repairReason || '';
  repairInput.addEventListener('input', () => { const d = getDayState(dateStr); d.blocks[block.id].repairReason = repairInput.value; setDayState(dateStr, d); });
  repairLabelEl.append(repairInput);
  repairInner.append(repairLabelEl);
  repairWrap.append(repairInner);
  form.append(repairWrap);

  // 若這筆是從計畫轉來的，顯示原計畫內容供對照
  if (block.planLinkedId && day.plans[block.planLinkedId]) {
    const plan = day.plans[block.planLinkedId];
    const planNote = plan.planNote ? `：${plan.planNote}` : '';
    form.append(make('p', 'rounded-lg bg-paper px-2.5 py-2 text-xs text-inkmuted', `原計畫${planNote}`));
  }

  // 紀錄內容
  const noteLabelEl = fieldLabel('紀錄內容（選填・簡短就好）');
  const noteTextarea = make('textarea', 'mt-1 block w-full rounded-lg border border-line px-2 py-2 text-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ink');
  noteTextarea.rows = 2;
  noteTextarea.maxLength = 150;
  noteTextarea.placeholder = '這段時間實際發生的細節，例如：完成客廳插座配線';
  noteTextarea.value = block.note || '';
  const counter = make('p', 'tnum mt-1 text-right text-[11px] text-inkfaint', `${noteTextarea.value.length}/150`);
  noteTextarea.addEventListener('input', () => {
    const d = getDayState(dateStr);
    d.blocks[block.id].note = noteTextarea.value;
    setDayState(dateStr, d);
    counter.textContent = `${noteTextarea.value.length}/150`;
  });
  noteLabelEl.append(noteTextarea);
  form.append(noteLabelEl, counter);

  // 持久錯誤提示（2026-07-24 事故教訓：不能只靠會自動消失的 toast）
  if (block.saveError) {
    const errBox = make('div', 'rounded-lg border-2 border-red-300 bg-red-50 px-3 py-2');
    errBox.append(make('p', 'text-xs font-black text-red-700', '上次儲存失敗，內容還在，請確認後重試'));
    errBox.append(make('p', 'mt-0.5 text-xs text-red-600', block.saveError));
    form.append(errBox);
  }

  // 動作列
  const actionsRow = make('div', 'flex flex-wrap items-center gap-2 pt-1');
  const saveBtn = make('button', 'tap44 rounded-xl bg-coral px-4 text-sm font-black text-white transition-transform hover:bg-coraldark active:scale-[0.97] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ink', block.saveError ? '重試儲存' : (block.synced ? '重新儲存' : '儲存這筆'));
  saveBtn.type = 'button';
  saveBtn.addEventListener('click', () => saveBlock(dateStr, block.id, saveBtn));
  actionsRow.append(saveBtn);

  if (!block.synced) {
    const delBtn = make('button', 'tap44 rounded-lg border border-line px-3 text-xs font-bold text-inkmuted hover:bg-paper focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ink', '刪除這筆');
    delBtn.type = 'button';
    delBtn.addEventListener('click', () => { if (confirm('刪除這筆尚未送出的草稿？')) deleteBlock(dateStr, block.id); });
    actionsRow.append(delBtn);
  }
  actionsRow.append(make('span', 'flex-1'));
  const collapseBtn = make('button', 'tap44 rounded-lg px-3 text-xs font-bold text-inkmuted hover:bg-paper focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ink', '收合');
  collapseBtn.type = 'button';
  collapseBtn.addEventListener('click', () => { EXPANDED_BLOCKS.delete(block.id); renderWorklogView(); });
  actionsRow.append(collapseBtn);
  form.append(actionsRow);

  wrap.append(form);
  return wrap;
}

// ================= 今日計畫（輕量、不需要時間；純本機，不送 API——見回報中的 schema 建議） =================
function addPlan(dateStr) {
  const day = getDayState(dateStr);
  const p = blankPlan();
  day.plans[p.id] = p;
  setDayState(dateStr, day);
  EXPANDED_PLANS.add(p.id);
  renderWorklogView();
}
function deletePlan(dateStr, planId) {
  const day = getDayState(dateStr);
  delete day.plans[planId];
  setDayState(dateStr, day);
  EXPANDED_PLANS.delete(planId);
  renderWorklogView();
}
function convertPlanToBlock(dateStr, planId) {
  const day = getDayState(dateStr);
  const plan = day.plans[planId];
  if (!plan) return;
  const blockId = addBlock(dateStr, { fields: { category: plan.category, otherCategoryText: plan.otherCategoryText, caseName: plan.caseName, repairReason: plan.repairReason, planLinkedId: planId } });
  const d2 = getDayState(dateStr);
  d2.plans[planId].convertedBlockId = blockId;
  setDayState(dateStr, d2);
  EXPANDED_PLANS.delete(planId);
  showToast('已建立對應的實際紀錄，補上實際時間後記得按「儲存這筆」');
  renderWorklogView();
}
function renderPlanCard(dateStr, day, plan) {
  const expanded = EXPANDED_PLANS.has(plan.id);
  const converted = !!plan.convertedBlockId && !!day.blocks[plan.convertedBlockId];
  const wrap = make('div', `rounded-xl border bg-white ${converted ? 'border-line opacity-70' : 'border-line'}`);
  wrap.id = `row-plan-${plan.id}`;

  const headerBtn = make('button', `tap44 flex w-full items-center gap-3 px-3 py-2.5 text-left transition-colors hover:bg-paper active:bg-paper focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ink ${expanded ? 'rounded-t-xl' : 'rounded-xl'}`);
  headerBtn.type = 'button';
  headerBtn.setAttribute('aria-expanded', expanded ? 'true' : 'false'); // 沿用 block 列同一套鍵盤/無障礙慣例，先前遺漏補上
  const previewCol = make('div', 'min-w-0 flex-1');
  const catLabel = plan.category ? (plan.category === OTHER_CATEGORY ? (plan.otherCategoryText || '其他') : plan.category) : '（尚未選項目）';
  const line = make('p', 'flex flex-wrap items-center gap-1.5');
  line.append(make('span', 'inline-block shrink-0 rounded-full bg-paper px-2 py-0.5 text-xs font-bold text-inkmuted', catLabel));
  if (converted) line.append(make('span', 'inline-flex shrink-0 items-center gap-0.5 text-xs font-bold text-inkmuted', `✓ 已轉為 ${day.blocks[plan.convertedBlockId].start}–${day.blocks[plan.convertedBlockId].end}`));
  if (plan.caseName) line.append(make('span', 'truncate text-sm font-bold text-ink', plan.caseName));
  previewCol.append(line);
  if (plan.planNote) previewCol.append(make('p', 'mt-0.5 truncate text-xs text-inkmuted', plan.planNote));
  headerBtn.append(previewCol);
  headerBtn.append(expandHintPill(expanded, !!plan.category));
  headerBtn.addEventListener('click', () => { if (EXPANDED_PLANS.has(plan.id)) EXPANDED_PLANS.delete(plan.id); else EXPANDED_PLANS.add(plan.id); renderWorklogView(); });
  wrap.append(headerBtn);

  if (!expanded) return wrap;
  const form = make('div', 'space-y-3 border-t border-line px-3 pb-3 pt-3');
  form.append(fieldLabel('項目'));
  form.append(categoryGrid(plan, (name) => {
    const d = getDayState(dateStr);
    const p = d.plans[plan.id];
    p.category = name;
    if (name !== OTHER_CATEGORY) p.otherCategoryText = '';
    setDayState(dateStr, d);
    renderWorklogView();
  }));
  if (plan.category === OTHER_CATEGORY) {
    const otherLabelEl = make('label', 'block text-xs font-bold text-inkmuted', '其他項目名稱');
    const otherInput = make('input', 'mt-1 block w-full rounded-lg border border-line px-2 text-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ink');
    otherInput.type = 'text';
    otherInput.value = plan.otherCategoryText || '';
    otherInput.addEventListener('input', () => { const d = getDayState(dateStr); d.plans[plan.id].otherCategoryText = otherInput.value; setDayState(dateStr, d); });
    otherLabelEl.append(otherInput);
    form.append(otherLabelEl);
  }
  const caseLabelEl = fieldLabel('案名/地址（選填）');
  const caseInput = make('input', 'mt-1 block w-full rounded-lg border border-line px-2 text-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ink');
  caseInput.type = 'text';
  caseInput.setAttribute('list', 'worklogCaseList');
  caseInput.value = plan.caseName || '';
  caseInput.addEventListener('input', () => { const d = getDayState(dateStr); d.plans[plan.id].caseName = caseInput.value; setDayState(dateStr, d); });
  caseLabelEl.append(caseInput);
  form.append(caseLabelEl);

  const noteLabelEl = fieldLabel('計畫在做什麼（簡短即可）');
  const noteInput = make('textarea', 'mt-1 block w-full rounded-lg border border-line px-2 py-2 text-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ink');
  noteInput.rows = 2;
  noteInput.maxLength = 120;
  noteInput.placeholder = '例如：原本排定 10 點去王公館驗收';
  noteInput.value = plan.planNote || '';
  noteInput.addEventListener('input', () => { const d = getDayState(dateStr); d.plans[plan.id].planNote = noteInput.value; setDayState(dateStr, d); });
  noteLabelEl.append(noteInput);
  form.append(noteLabelEl);

  const actionsRow = make('div', 'flex flex-wrap items-center gap-2 pt-1');
  if (!converted) {
    const convertBtn = make('button', 'tap44 rounded-xl bg-coral px-4 text-sm font-black text-white transition-transform hover:bg-coraldark active:scale-[0.97] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ink disabled:cursor-not-allowed disabled:bg-line disabled:text-inkmuted', '轉為實際紀錄 →');
    convertBtn.type = 'button';
    convertBtn.disabled = !plan.category;
    convertBtn.addEventListener('click', () => convertPlanToBlock(dateStr, plan.id));
    actionsRow.append(convertBtn);
  }
  const delBtn = make('button', 'tap44 rounded-lg border border-line px-3 text-xs font-bold text-inkmuted hover:bg-paper focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ink', '刪除計畫');
  delBtn.type = 'button';
  delBtn.addEventListener('click', () => { if (confirm('刪除這筆計畫？')) deletePlan(dateStr, plan.id); });
  actionsRow.append(delBtn);
  actionsRow.append(make('span', 'flex-1'));
  const collapseBtn = make('button', 'tap44 rounded-lg px-3 text-xs font-bold text-inkmuted hover:bg-paper focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ink', '收合');
  collapseBtn.type = 'button';
  collapseBtn.addEventListener('click', () => { EXPANDED_PLANS.delete(plan.id); renderWorklogView(); });
  actionsRow.append(collapseBtn);
  form.append(actionsRow);
  wrap.append(form);
  return wrap;
}

// ================= 填寫頁 =================
function dateToggleNode() {
  const wrap = make('div', 'mb-4 inline-flex gap-1 rounded-xl border-2 border-line bg-white p-1');
  [{ key: 'today', label: '今天' }, { key: 'tomorrow', label: '明天' }].forEach((opt) => {
    const active = SELECTED_DATE === opt.key;
    const btn = make('button', `tap44 rounded-lg px-4 text-sm font-black transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ink ${active ? 'bg-coral text-white' : 'text-inkmuted hover:bg-paper'}`, opt.label);
    btn.type = 'button';
    btn.addEventListener('click', () => { if (SELECTED_DATE !== opt.key) { SELECTED_DATE = opt.key; EXPANDED_BLOCKS = new Set(); EXPANDED_PLANS = new Set(); renderWorklogView(); } });
    wrap.append(btn);
  });
  return wrap;
}

function renderWorklogView() {
  const root = byId('view-worklog');
  root.replaceChildren();
  const dateStr = selectedDateStr();
  const day = getDayState(dateStr);
  const isTomorrow = SELECTED_DATE === 'tomorrow';

  if (CURRENT_IDENTITY.role === 'manager') {
    root.append(emptyNote('主管身分沒有固定部門選單，仍可以下方「+ 新增一筆」記錄自己的時間（項目會顯示所有部門聯集），或切到「主管總覽」查看同仁紀錄。'));
  }

  const head = make('div', 'mb-4');
  head.append(make('p', 'text-xs font-bold tracking-wide text-coraldark', `${CURRENT_IDENTITY.deptKey ? DEPARTMENTS[CURRENT_IDENTITY.deptKey].label : '主管'}・自訂起訖時間`));
  head.append(make('h2', 'text-xl font-black text-ink sm:text-2xl', isTomorrow ? '明天，你打算做什麼？' : '今天，你在忙什麼？'));
  head.append(make('p', 'mt-1 text-sm text-inkmuted', isTomorrow ? `${selectedDateDisplay()}・先列幾筆明天的計畫，時間到了再回來記實際狀況。` : `${selectedDateDisplay()}・想幾點記就幾點記，中午吃飯、臨時被叫走都可以直接補一筆。`));
  root.append(head);
  root.append(dateToggleNode());

  // 草稿提示：放最上面、不用捲動就看得到（2026-07-24 事故教訓）。用「尚未送出」語意色——
  // 這則提示本質就是在講一批 pending 狀態的紀錄，跟徽章色系呼應，不用額外學一個顏色。
  const unsyncedFilled = blocksList(day).filter((b) => isBlockFilled(b) && !b.synced);
  if (unsyncedFilled.length > 0) {
    root.append(make('div', 'mb-4 rounded-xl border-2 border-pending bg-pendingtint px-4 py-2.5 text-sm font-black text-pendingdark',
      `⚠ 你有 ${unsyncedFilled.length} 筆已經填寫但還沒送出成功，展開後按「儲存這筆」才會真的存進系統`));
  }

  // 今日計畫
  const planSection = make('div', 'mb-5');
  const planHead = make('div', 'mb-2 flex items-center justify-between');
  planHead.append(make('h3', 'text-sm font-black text-ink', isTomorrow ? '明天計畫（選填）' : '今日計畫（選填）'));
  const addPlanBtn = make('button', 'tap44 rounded-lg border-2 border-line px-3 text-xs font-bold text-ink hover:bg-paper focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ink', '+ 新增計畫');
  addPlanBtn.type = 'button';
  addPlanBtn.addEventListener('click', () => addPlan(dateStr));
  planHead.append(addPlanBtn);
  planSection.append(planHead);
  const plans = plansList(day);
  if (plans.length === 0) {
    planSection.append(make('p', 'text-xs text-inkfaint', '計畫是選填的暖身清單，不用先排也可以直接往下記實際發生的事。排了之後可以一鍵「轉為實際紀錄」。'));
  } else {
    const planList = make('div', 'space-y-2');
    plans.forEach((p) => planList.append(renderPlanCard(dateStr, day, p)));
    planSection.append(planList);
  }
  root.append(planSection);

  // 快速新增
  const quickRow = make('div', 'mb-4 flex flex-wrap gap-2');
  const addBtn = make('button', 'tap44 rounded-xl bg-coral px-4 text-sm font-black text-white transition-transform hover:bg-coraldark active:scale-[0.97] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ink', '+ 新增一筆');
  addBtn.type = 'button';
  addBtn.addEventListener('click', () => addBlock(dateStr));
  const fullDayBtn = make('button', 'tap44 rounded-xl border-2 border-line px-4 text-sm font-bold text-ink hover:bg-paper focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ink', '整天都在忙同一件事');
  fullDayBtn.type = 'button';
  fullDayBtn.addEventListener('click', () => addFullDayBlock(dateStr));
  quickRow.append(addBtn, fullDayBtn);
  root.append(quickRow);

  // 彩色時間軸橫條（2026-07-25 restore）：at-a-glance 總覽，用色塊＋斜紋畫出一整天的分佈，
  // 點色塊跳到下面清單對應那列，點空檔直接帶時間新增一筆。判定邏輯沿用 computeTimelineWindow()／
  // buildTimelineSegments()，不動。
  const blocks = blocksList(day);
  root.append(renderTimelineBar(dateStr, day, blocks));

  // 紀錄清單：只列實際紀錄（不重複畫空檔——空檔已經在上面時間軸橫條裡處理過），依時間排序。
  root.append(make('h3', 'mb-2 text-sm font-black text-ink', '今天的紀錄'));
  const list = make('div', 'space-y-2');
  if (blocks.length === 0) {
    list.append(emptyNote('還沒有任何紀錄，點上面「+ 新增一筆」開始。'));
  } else {
    sortedBlocks(day).forEach((b) => list.append(renderBlockRow(dateStr, day, b)));
  }
  root.append(list);

  // 底部：還有未送出成功的，提供一鍵全部重試（安全網，不是必要動作——每筆本來就是各自即時送出）
  const stillUnsynced = blocksList(day).filter((b) => isBlockFilled(b) && !b.synced);
  if (stillUnsynced.length > 0) {
    root.append(make('div', 'h-4'));
    const retryBar = make('div', 'rounded-xl border-2 border-pending bg-white px-4 py-3');
    const row = make('div', 'flex items-center justify-between gap-3');
    row.append(make('p', 'text-sm font-bold text-pendingdark', `還有 ${stillUnsynced.length} 筆尚未送出成功`));
    const retryAllBtn = make('button', 'tap44 shrink-0 rounded-xl bg-ink px-4 text-sm font-black text-white hover:bg-ink/90 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ink', '全部重試送出');
    retryAllBtn.type = 'button';
    retryAllBtn.addEventListener('click', async () => {
      retryAllBtn.disabled = true;
      retryAllBtn.textContent = '送出中…';
      for (const b of stillUnsynced) {
        // eslint-disable-next-line no-await-in-loop
        await new Promise((resolve) => {
          mockSubmitBlock().then((res) => {
            const d = getDayState(dateStr);
            const blk = d.blocks[b.id];
            if (blk) { blk.synced = res.ok; blk.saveError = res.ok ? null : res.error; setDayState(dateStr, d); }
            resolve();
          });
        });
      }
      renderWorklogView();
    });
    row.append(retryAllBtn);
    retryBar.append(row);
    root.append(retryBar);
  }
}

// ================= 主管總覽（唯讀） =================
// mock 團隊資料：跨兩個部門，示範分流後的差異；實際紀錄一律視為已送出（真實 API 回來的資料
// 定義上就是已經寫入 Ragic 的資料，不會有「草稿」狀態）。

      { id: 'a2', start: '09:30', end: '10:15', category: '廠商聯繫', caseName: '王公館・台中市南屯區文心路三段', repairReason: '磁磚色差需重新確認', note: '聯繫泥作師傅確認磁磚批號', synced: true },
      { id: 'a3', start: '10:30', end: '11:30', category: '驗收', caseName: '陳宅・彰化縣員林市中山路', repairReason: '衛浴防水複驗', note: '複驗通過，補拍照片', synced: true },

      { id: 'b2', start: '13:00', end: '14:00', category: '修繕', caseName: '康橋苑 12F・台中市北屯區崇德路', repairReason: '排水管異音', note: '約師傅下週複查', synced: true },
      { id: 'b3', start: '13:30', end: '14:15', category: '委託', caseName: '松林社區 B棟・彰化縣和美鎮彰南路', note: '簽委託書', synced: true },
    ] },
    { id: 'C', label: '同仁 C（工務）', deptKey: 'construction', blocks: [] },

}
function memberEntryLine(b) {
  const wrap = make('div', 'rounded-lg bg-paper p-2.5 text-sm');
  const top = make('p', 'flex flex-wrap items-center gap-1.5');
  top.append(make('span', 'tnum text-xs font-bold text-inkfaint', `${b.start}–${b.end}`));
  top.append(make('span', 'rounded-full bg-white px-2 py-0.5 text-xs font-bold text-inkmuted', b.category));
  if (b.caseName) top.append(make('span', 'text-ink', b.caseName));
  wrap.append(top);
  if (b.repairReason) wrap.append(make('p', 'mt-1 text-xs text-inkmuted', `報修原因：${b.repairReason}`));
  if (b.note) wrap.append(make('p', 'mt-0.5 text-xs text-ink', b.note));
  return wrap;
}
function memberCard(member) {
  const total = member.blocks.length;
  const expanded = EXPANDED_MEMBER === member.id;
  const statusText = total === 0 ? '今日尚無紀錄' : `已記 ${total} 筆`;
  // 狀態不再用色相區分（0 筆／有筆都是同一個 coral），改用外框／實心的形狀差異
  const statusCls = total === 0 ? 'border border-line bg-white text-inkmuted' : 'bg-coral text-white';

  const card = make('div', 'rounded-2xl border border-line bg-white');
  const headerBtn = make('button', `tap44 flex w-full items-center justify-between gap-3 px-4 py-3.5 text-left transition-colors hover:bg-paper active:bg-paper focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ink ${expanded ? 'rounded-t-2xl' : 'rounded-2xl'}`);
  headerBtn.type = 'button';
  const left = make('div', 'flex items-center gap-2.5');
  left.append(make('span', 'text-sm font-black text-ink', member.label));
  headerBtn.append(left);
  const right = make('div', 'flex items-center gap-2');
  right.append(make('span', `rounded-full px-2.5 py-1 text-xs font-bold ${statusCls}`, statusText));
  const chevWrap = make('span', 'flex h-7 w-7 shrink-0 items-center justify-center rounded-full border-2 border-line bg-white text-ink');
  chevWrap.innerHTML = expanded ? CHEVRON_UP_SVG : CHEVRON_DOWN_SVG;
  right.append(chevWrap);
  headerBtn.append(right);
  headerBtn.addEventListener('click', () => { EXPANDED_MEMBER = expanded ? null : member.id; renderOverviewView(); });
  card.append(headerBtn);

  if (expanded) {
    const body = make('div', 'space-y-3 border-t border-line p-4');
    if (total === 0) body.append(emptyNote('今日尚無紀錄。'));
    else member.blocks.slice().sort((a, b) => timeToMinutes(a.start) - timeToMinutes(b.start)).forEach((b) => body.append(memberEntryLine(b)));
    card.append(body);
  }
  return card;
}
function renderOverviewView() {
  const root = byId('view-overview');
  root.replaceChildren();
  if (CURRENT_IDENTITY.role !== 'manager') {
    root.append(emptyNote('此頁僅主管角色可查看，請用上方「原型示範」切換為主管身分預覽。'));
    return;
  }
  const head = make('div', 'mb-5');
  head.append(make('p', 'text-xs font-bold tracking-wide text-coraldark', '主管視角・唯讀'));
  head.append(make('h2', 'text-xl font-black text-ink sm:text-2xl', '本日工作日誌總覽'));
  head.append(make('p', 'mt-1 text-sm text-inkmuted', `${dateDisplayForOffset(0)}・依人員檢視，跨部門一起看，各自項目清單維持各自部門的分類。`));
  root.append(head);
  const list = make('div', 'space-y-3');
  mockTeam().forEach((m) => list.append(memberCard(m)));
  root.append(list);
}

// ================= 平台外殼：側欄／底部 tab／路由 =================
function icon(name) {
  const paths = {
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2" fill="none" stroke-linecap="round"/>',
    clipboard: '<rect x="6" y="4" width="12" height="16" rx="2" fill="none"/><path d="M9 4V3a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v1" fill="none"/><path d="M9 10h6M9 14h6M9 18h3" stroke-linecap="round"/>',
    link: '<path d="M8 12.5l4.2-4.2" stroke-linecap="round"/><path d="M9.5 15.5A4 4 0 0 1 8 9.4l2-2a4 4 0 0 1 5.6 5.6l-.9.9" fill="none"/><path d="M14.5 8.5A4 4 0 0 1 16 14.6l-2 2a4 4 0 0 1-5.6-5.6l.9-.9" fill="none"/>',
  };
  return `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">${paths[name] || ''}</svg>`;
}
const VALID_VIEWS = ['worklog', 'overview'];
const VIEW_TITLES = { worklog: '工作日誌', overview: '主管總覽' };
const NAV_ITEMS = [
  { id: 'worklog', label: '工作日誌', icon: 'clock' },
  { id: 'overview', label: '主管總覽', icon: 'clipboard', managerOnly: true },
];
const PLANNED_ITEMS = [
  { id: 'link', label: '案件正式關聯', icon: 'link', note: '工作日誌與工程案件的正式資料關聯規劃中，目前案名為文字＋自動建議，尚未串接。' },
];
function currentView() {
  const h = (location.hash || '').replace('#', '');
  return VALID_VIEWS.includes(h) ? h : 'worklog';
}
function sidebarNavButton(item) {
  const active = currentView() === item.id;
  const locked = item.managerOnly && CURRENT_IDENTITY.role !== 'manager';
  // 深色側欄配色（2026-07-25 restore）：預設文字白色系半透明，active 用實心強調色，
  // hover 用半透明白色疊層（不能用 hover:bg-white，那是淺色側欄才成立的寫法）。
  const cls = active ? 'bg-coral text-white' : locked ? 'text-white/30 hover:bg-white/10' : 'text-white/70 hover:bg-white/10 hover:text-white';
  const btn = make('button', `flex w-full items-center gap-2.5 rounded-xl px-3 py-2.5 text-sm font-bold transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white ${cls}`);
  btn.type = 'button';
  if (active) btn.setAttribute('aria-current', 'page');
  const ic = make('span', 'h-5 w-5 shrink-0');
  ic.innerHTML = icon(item.icon);
  btn.append(ic, make('span', 'flex-1 text-left', item.label + (locked ? '（主管專用）' : '')));
  btn.addEventListener('click', () => { if (locked) { showToast('此頁僅主管角色可查看，上方可切換示範身分'); return; } location.hash = item.id; });
  return btn;
}
function plannedButton(item) {
  const btn = make('button', 'flex w-full items-center gap-2.5 rounded-xl px-3 py-2.5 text-sm font-bold text-white/40 hover:bg-white/10 hover:text-white/70 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white');
  btn.type = 'button';
  const ic = make('span', 'h-5 w-5 shrink-0');
  ic.innerHTML = icon(item.icon);
  btn.append(ic, make('span', 'flex-1 text-left', `${item.label}（規劃中）`));
  btn.addEventListener('click', () => showToast(item.note));
  return btn;
}
function renderSidebarNav() {
  const nav = byId('sidebarNav');
  nav.replaceChildren();
  NAV_ITEMS.forEach((item) => nav.append(sidebarNavButton(item)));
  const planned = byId('sidebarPlanned');
  planned.replaceChildren();
  PLANNED_ITEMS.forEach((item) => planned.append(plannedButton(item)));
}
function renderBottomTabs() {
  const bar = byId('bottomTabBar');
  bar.replaceChildren();
  NAV_ITEMS.forEach((item) => {
    const active = currentView() === item.id;
    const locked = item.managerOnly && CURRENT_IDENTITY.role !== 'manager';
    const cls = locked ? 'text-inkfaint/50' : active ? 'text-coral' : 'text-inkfaint';
    const btn = make('button', `flex flex-1 flex-col items-center gap-0.5 py-2 text-[11px] font-bold focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-ink ${cls}`);
    btn.type = 'button';
    if (active) btn.setAttribute('aria-current', 'page');
    const ic = make('span', 'h-5 w-5');
    ic.innerHTML = icon(item.icon);
    btn.append(ic, make('span', '', item.label));
    btn.addEventListener('click', () => { if (locked) { showToast('此頁僅主管角色可查看，上方可切換示範身分'); return; } location.hash = item.id; });
    bar.append(btn);
  });
}
function renderIdentitySwitch() {
  const wrap = byId('identitySwitch');
  wrap.replaceChildren();
  MOCK_IDENTITIES.forEach((idn) => {
    const active = CURRENT_IDENTITY.key === idn.key;
    const btn = make('button', `tap44 rounded-lg px-3 text-xs font-black transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ink ${active ? 'bg-coral text-white' : 'text-inkmuted hover:bg-white'}`, idn.label);
    btn.type = 'button';
    btn.setAttribute('aria-pressed', active ? 'true' : 'false');
    btn.addEventListener('click', () => {
      if (CURRENT_IDENTITY.key === idn.key) return;
      setIdentity(idn.key);
      EXPANDED_BLOCKS = new Set();
      EXPANDED_PLANS = new Set();
      EXPANDED_MEMBER = null;
      if (currentView() === 'overview' && CURRENT_IDENTITY.role !== 'manager') location.hash = 'worklog';
      updateChromeLabels();
      applyRoute();
      renderIdentitySwitch();
      showToast(`已切換為：${idn.label}（原型示範用，正式版由連結 token 決定）`);
    });
    wrap.append(btn);
  });
}
function updateChromeLabels() {
  const deptLabel = CURRENT_IDENTITY.deptKey ? DEPARTMENTS[CURRENT_IDENTITY.deptKey].label : '主管視角';
  byId('sidebarSubtitle').textContent = `${deptLabel}・${CURRENT_IDENTITY.label}`;
}
function renderPaletteSwitch() {
  const wrap = byId('paletteSwitch');
  wrap.replaceChildren();
  PALETTES.forEach((p) => {
    const active = CURRENT_PALETTE === p.key;
    const btn = make('button', `tap44 rounded-lg px-3 text-xs font-black transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ink ${active ? 'bg-coral text-white' : 'text-inkmuted hover:bg-white'}`, p.label);
    btn.type = 'button';
    btn.setAttribute('aria-pressed', active ? 'true' : 'false');
    btn.title = p.note;
    btn.addEventListener('click', () => {
      if (CURRENT_PALETTE === p.key) return;
      setPalette(p.key);
      renderPaletteSwitch();
      showToast(`配色 ${p.label}・${p.note}`);
    });
    wrap.append(btn);
  });
}
function applyRoute() {
  let view = currentView();
  if (view === 'overview' && CURRENT_IDENTITY.role !== 'manager') {
    history.replaceState(null, '', location.pathname + location.search + '#worklog');
    view = 'worklog';
    showToast('此頁僅主管角色可查看，已切回工作日誌');
  }
  VALID_VIEWS.forEach((v) => { byId('view-' + v).hidden = (v !== view); });
  byId('pageTitle').textContent = VIEW_TITLES[view];
  renderSidebarNav();
  renderBottomTabs();
  if (view === 'worklog') renderWorklogView();
  else renderOverviewView();
}
window.addEventListener('hashchange', applyRoute);

byId('debugToggleBtn').addEventListener('click', () => { byId('debugPanel').classList.toggle('hidden'); });
byId('resetButton').addEventListener('click', () => {
  if (!confirm('清空本機暫存的所有身分的示範資料，重新整理頁面？（純本機原型，不影響任何線上資料）')) return;
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(RECENT_CAT_KEY);
  location.hash = 'worklog';
  location.reload();
});

// ================= 初始化 =================
(function init() {
  const dl = byId('worklogCaseList');
  MOCK_CASES.forEach((c) => { const opt = document.createElement('option'); opt.value = c; dl.append(opt); });

  const initHash = (location.hash || '').replace('#', '');
  if (!VALID_VIEWS.includes(initHash)) history.replaceState(null, '', location.pathname + location.search + '#worklog');

  document.body.dataset.palette = CURRENT_PALETTE;
  renderPaletteSwitch();
  renderIdentitySwitch();
  updateChromeLabels();
  applyRoute();
})();
</script>
